main{max-width:860px;margin:0 auto;padding:14px}

  const mkErr=e=>{const m=(e&&e.message)||"Erreur";const x=new Error(/row-level security|permission denied|droit insuffisant/i.test(m)||(e&&e.code==="42501")?"Droit insuffisant pour cette action.":m);x.code=(e&&(e.code==="42501"||/row-level security|permission denied/i.test(m)))?"not_granted":(e&&e.code)||"erreur";return x};
  const fr=m=>/Invalid login credentials/i.test(m)?"E-mail ou mot de passe incorrect.":/rate limit|too many/i.test(m)?"Trop de tentatives : patientez quelques minutes.":/Email not confirmed/i.test(m)?"Compte non confirmé : contactez l'administrateur.":/network|fetch/i.test(m)?"Connexion au serveur impossible : vérifiez votre accès internet.":m;

  /* ---------- Écran de connexion ---------- */
  function overlay(html){
    let o=$$("#sbauth");
    if(!o){o=document.createElement("div");o.id="sbauth";o.style.cssText="position:fixed;inset:0;z-index:100;background:var(--bg,#f3f4f9);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto";document.body.appendChild(o)}
    o.innerHTML=`<div style="width:min(420px,100%);background:var(--cd,#fff);color:var(--tx,#1b1f33);border-radius:18px;box-shadow:0 10px 40px rgba(20,25,60,.18);padding:24px;border-top:5px solid var(--or,#E8561A)"><h1 style="margin:0 0 4px;font-size:22px">Archives – NITA SA</h1><div class="mu" style="margin-bottom:14px">Service Archivage · accès réservé</div>${html}</div>`;
    return o;
  }
  const hideOverlay=()=>{const o=$$("#sbauth");if(o)o.remove()};
  function loginView(msg){
    return new Promise(res=>{
      const o=overlay(`<label for="sb_em">Adresse e-mail</label><input id="sb_em" type="email" autocomplete="username" inputmode="email"><label for="sb_pw">Mot de passe</label><input id="sb_pw" type="password" autocomplete="current-password"><div id="sb_msg" class="mu" style="color:var(--er,#b3261e);min-height:20px;margin:8px 0">${esc(msg||"")}</div><div class="acts"><button class="pri" id="sb_go">Se connecter</button></div><p style="margin:14px 0 0"><a href="#" id="sb_forgot" style="color:var(--ac,#25348A)">Mot de passe oublié ?</a></p>`);
      const msgEl=o.querySelector("#sb_msg");
      const go=async()=>{
        const email=o.querySelector("#sb_em").value.trim(),password=o.querySelector("#sb_pw").value;
        if(!email||!password){msgEl.textContent="Saisissez votre e-mail et votre mot de passe.";return}
        const b=o.querySelector("#sb_go");b.disabled=true;msgEl.textContent="Connexion…";msgEl.style.color="var(--mu,#5f6580)";
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error){b.disabled=false;msgEl.style.color="var(--er,#b3261e)";msgEl.textContent=fr(error.message);return}
        res();
      };
      o.querySelector("#sb_go").onclick=go;
      o.querySelector("#sb_pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
      o.querySelector("#sb_forgot").onclick=async e=>{e.preventDefault();const email=o.querySelector("#sb_em").value.trim();
        if(!email){msgEl.style.color="var(--er,#b3261e)";msgEl.textContent="Saisissez d'abord votre e-mail ci-dessus.";return}
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
        msgEl.style.color=error?"var(--er,#b3261e)":"var(--ok,#1b7a4a)";msgEl.textContent=error?fr(error.message):"Si ce compte existe, un e-mail de réinitialisation vient d'être envoyé."};
      setTimeout(()=>o.querySelector("#sb_em").focus(),50);
    });
  }
  function newPwdView(){
    const o=overlay(`<p>Choisissez un nouveau mot de passe (12 caractères minimum).</p><label for="sb_n1">Nouveau mot de passe</label><input id="sb_n1" type="password" autocomplete="new-password"><label for="sb_n2">Confirmez</label><input id="sb_n2" type="password" autocomplete="new-password"><div id="sb_msg" class="mu" style="color:var(--er,#b3261e);min-height:20px;margin:8px 0"></div><div class="acts"><button class="pri" id="sb_ok">Enregistrer</button></div>`);
    o.querySelector("#sb_ok").onclick=async()=>{
      const a=o.querySelector("#sb_n1").value,b=o.querySelector("#sb_n2").value,m=o.querySelector("#sb_msg");
      if(a.length<12){m.textContent="12 caractères minimum.";return}
      if(a!==b){m.textContent="Les deux mots de passe sont différents.";return}
      const {error}=await sb.auth.updateUser({password:a});
      if(error){m.textContent=fr(error.message);return}

  }
  function blockedView(text){
    const o=overlay(`<p>${esc(text)}</p><div class="acts"><button id="sb_out">Se déconnecter</button></div>`);
    o.querySelector("#sb_out").onclick=async()=>{await sb.auth.signOut();location.reload()};
  }

  /* ---------- Base de données (même interface que la plateforme Claude) ---------- */
  const regs={};                                   // collection -> ensemble d'écouteurs (pour les écritures locales)
  const applyLocal=(c,id,data)=>{(regs[c]||[]).forEach(r=>r.apply(id,data))};
  function docsCollection(c){
    const ref=id=>docRef(c,id||newId());
    return {
      doc:ref,
      get:async()=>{const rows=await fetchAll(c);return {docs:rows.map(r=>({id:r.id,data:()=>r.data}))}},
      onSnapshot(cb,errcb){
        const cache=new Map();let timer=0,dead=false,ch=null;
        const emit=()=>{if(dead||timer)return;timer=setTimeout(()=>{timer=0;if(!dead)cb({docs:[...cache.entries()].map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))}))})},30)};
        const reg={apply(id,data){if(data===null)cache.delete(id);else cache.set(id,data);emit()},merge(id,patch){if(!cache.has(id))return false;cache.set(id,{...cache.get(id),...patch});emit();return true}};
        (regs[c]=regs[c]||new Set()).add(reg);
        const load=async()=>{try{const rows=await fetchAll(c);cache.clear();rows.forEach(r=>cache.set(r.id,r.data));emit()}catch(e){if(errcb)errcb(mkErr(e))}};
        load();
        if(c!=="fichiers_data"){
          try{
            ch=sb.channel("rt-"+c+"-"+newId()).on("postgres_changes",{event:"*",schema:"public",table:"documents",filter:"collection=eq."+c},p=>{
              if(p.eventType==="DELETE"){cache.delete(p.old&&p.old.id);emit()}else if(p.new&&p.new.id){cache.set(p.new.id,p.new.data);emit()}
            }).subscribe(st=>{if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")setTimeout(load,4000)});
          }catch(e){}
        }
        let hid=0;const vis=()=>{if(document.visibilityState==="hidden"){hid=Date.now();return}if(Date.now()-hid>60000)load()};document.addEventListener("visibilitychange",vis);
        return ()=>{dead=true;regs[c].delete(reg);document.removeEventListener("visibilitychange",vis);try{ch&&sb.removeChannel(ch)}catch(e){}};
      }
    };
  }
  async function fetchAll(c){
    const pg=from=>sb.from("documents").select("id,data").eq("collection",c).order("id").range(from,from+999);
    if(c==="docs"){                                   // grosse collection : les 2 premières pages en parallèle
      const [a,b]=await Promise.all([pg(0),pg(1000)]);
      if(a.error)throw a.error;const out=[...a.data];if(a.data.length<1000)return out;
      if(b.error)throw b.error;out.push(...b.data);
      for(let from=2000;b.data.length===1000;from+=1000){const r=await pg(from);if(r.error)throw r.error;out.push(...r.data);if(r.data.length<1000)break}
      return out;
    }
    const out=[];for(let from=0;;from+=1000){
      const {data,error}=await pg(from);
      if(error)throw error;out.push(...data);if(data.length<1000)break;
    }
    return out;
  }
  function docRef(c,id){
    return {
      id,
      async set(o){
        const data=JSON.parse(JSON.stringify(o));
        let {error}=await sb.from("documents").insert({collection:c,id,data});
        if(error&&error.code==="23505"){                       // existe déjà : remplacement (comme sur la plateforme Claude)
          const r=await sb.from("documents").update({data}).eq("collection",c).eq("id",id).select("id");
          if(r.error)throw mkErr(r.error);if(!r.data||!r.data.length)throw mkErr({code:"42501"});error=null;
        }
        if(error)throw mkErr(error);
        applyLocal(c,id,data);
      },
      async update(patch){
        const p=JSON.parse(JSON.stringify(patch));
        const {data,error}=await sb.rpc("merge_doc",{p_collection:c,p_id:id,p_patch:p});
        if(error)throw mkErr(error);
        if(!data)throw mkErr({code:"42501",message:"Document introuvable ou droit insuffisant."});
        // mise à jour locale sans nouvel aller-retour réseau (fusion superficielle, comme « data || patch » côté serveur)
        let done=false;(regs[c]||[]).forEach(r=>{if(r.merge&&r.merge(id,p))done=true});
        if(!done){const g=await sb.from("documents").select("data").eq("collection",c).eq("id",id).maybeSingle();if(g.data)applyLocal(c,id,g.data.data)}
      },
      async delete(){
        const {data,error}=await sb.from("documents").delete().eq("collection",c).eq("id",id).select("id");
        if(error)throw mkErr(error);
        if(!data||!data.length)throw mkErr({code:"42501",message:"Suppression refusée."});
        applyLocal(c,id,null);
      },
      async get(){
        const {data,error}=await sb.from("documents").select("data").eq("collection",c).eq("id",id).maybeSingle();
        if(error)throw mkErr(error);
        return {exists:!!data,data:()=>data?data.data:undefined};
      }
    };
  }
  /* « membres » = table members (comptes et rôles) */
  const mrow=r=>({uid:r.user_id,fonction:ROLE_FN[r.role]||r.role,nom:r.nom||"",prenom:r.prenom||"",actif:r.actif!==false});
  function membersCollection(){
    return {
      doc:id=>memberRef(id),
      onSnapshot(cb,errcb){
        let dead=false;
        const load=async()=>{
          const {data,error}=await sb.from("members").select("user_id,role,nom,prenom,actif");
          if(dead)return;if(error){if(errcb)errcb(mkErr(error));return}
          cb({docs:data.map(r=>({id:r.user_id,data:()=>mrow(r)}))});
        };
        load();const reg={apply(){load()}};(regs.membres=regs.membres||new Set()).add(reg);
        let hid=0;const vis=()=>{if(document.visibilityState==="hidden"){hid=Date.now();return}if(Date.now()-hid>60000)load()};document.addEventListener("visibilitychange",vis);
        return ()=>{dead=true;regs.membres.delete(reg);document.removeEventListener("visibilitychange",vis)};
      }
    };
  }
  function memberRef(id){
    const done=()=>(regs.membres||[]).forEach(r=>r.apply());
    return {
      id,
      async set(o){
        const role=FN_ROLE[o.fonction]||"lecteur",uid=o.uid||id;
        const {error}=await sb.from("members").upsert({user_id:uid,role,nom:o.nom||"",prenom:o.prenom||"",actif:o.actif!==false},{onConflict:"user_id"});
        if(error)throw mkErr(error);done();
      },
      async update(p){
        const u={};if(p.fonction)u.role=FN_ROLE[p.fonction]||"lecteur";if("actif" in p)u.actif=!!p.actif;if("nom" in p)u.nom=p.nom;if("prenom" in p)u.prenom=p.prenom;
        const {data,error}=await sb.from("members").update(u).eq("user_id",id).select("user_id");
        if(error)throw mkErr(error);if(!data||!data.length)throw mkErr({code:"42501"});done();
      },
      async delete(){
        const {data,error}=await sb.from("members").delete().eq("user_id",id).select("user_id");
        if(error)throw mkErr(error);if(!data||!data.length)throw mkErr({code:"42501"});done();
      },
      async get(){const {data}=await sb.from("members").select("user_id,role,nom,prenom,actif").eq("user_id",id).maybeSingle();return {exists:!!data,data:()=>data?mrow(data):undefined}}
    };
  }
  function makeDB(){
    return {
      collection:c=>c==="membres"?membersCollection():docsCollection(c),
      doc(path){const p=String(path).split("/");if(p.length!==2)throw new Error("chemin non pris en charge : "+path);return p[0]==="membres"?memberRef(p[1]):docRef(p[0],p[1])}
    };
  }

  /* ---------- Utilisateur ---------- */
  let annuaireCache=null,annuaireT=0;
  async function annuaire(){
    if(!ME||ME.role!=="admin")return [];
    if(annuaireCache&&Date.now()-annuaireT<30000)return annuaireCache;
    const {data,error}=await sb.rpc("annuaire");if(error)return annuaireCache||[];
    annuaireCache=data||[];annuaireT=Date.now();return annuaireCache;
  }
  const dispName=r=>((r.prenom||"")+" "+(r.nom||"")).trim()||r.email||"";
  function makeUser(){
    return {
      me:async()=>({id:ME.id,name:ME.name,email:ME.email,fonction:ROLE_FN[ME.role]||""}),
      id:async()=>ME.id,
      isOwner:async()=>ME.role==="admin",
      canEdit:async()=>ME.role==="admin",
      can:async n=>n==="data.write"?WRITERS.includes(ME.role):true,
      profiles:async ids=>{
        const out={};ids.forEach(i=>out[i]={name:""});out[ME.id]={name:ME.name};
        if(ME.role==="admin"){(await annuaire()).forEach(r=>{if(out[r.user_id])out[r.user_id]={name:dispName(r)}})}
        return out;
      },
      search:async q=>{
        q=String(q||"").trim().toLowerCase();if(ME.role!=="admin"||q.length<2)return [];
        annuaireT=0;
        return (await annuaire()).filter(r=>!r.role&&((r.email||"").toLowerCase().includes(q)||dispName(r).toLowerCase().includes(q))).map(r=>({id:r.user_id,name:r.email||dispName(r)}));
      },
      annuaire
    };
  }

  /* ---------- Téléchargements ---------- */
  const MIME={csv:"text/csv;charset=utf-8",json:"application/json",txt:"text/plain;charset=utf-8",html:"text/html;charset=utf-8",pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",zip:"application/zip"};
  const downloads={save:async({filename,data})=>{
    if(!filename||data==null||data==="")throw {code:"bad_request",message:"fichier vide"};
    const ext=String(filename).split(".").pop().toLowerCase();
    const blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||"application/octet-stream"});
    const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=String(filename).replace(/[\\/:*?"<>|]+/g,"_");document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
    return {status:"saved"};
  }};

  /* ---------- Fichiers (stockage privé Supabase) ---------- */
  const assets={
    async upload(file,opts){
      const bucket=opts&&opts.type?"fichiers":"scans",safe=String(file.name||"fichier").replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80),path=newId()+"-"+safe;
      const ct=file.type||(opts&&opts.type)||"application/octet-stream";
      const {error}=await sb.storage.from(bucket).upload(path,file,{contentType:ct,upsert:false});
      if(error)throw mkErr(error);
      return {id:bucket+"/"+path,sizeBytes:file.size,contentType:ct};
    },
    async delete(id){const i=String(id).indexOf("/"),{error}=await sb.storage.from(String(id).slice(0,i)).remove([String(id).slice(i+1)]);if(error)throw mkErr(error)},
    async blob(id){const i=String(id).indexOf("/"),{data,error}=await sb.storage.from(String(id).slice(0,i)).download(String(id).slice(i+1));if(error)throw mkErr(error);return data}
  };

  /* ---------- Démarrage ---------- */
  async function loadMe(session){
    const u=session.user,{data,error}=await sb.from("members").select("role,nom,prenom,actif").eq("user_id",u.id).maybeSingle();
    if(error)throw error;
    if(!data||data.actif===false)return null;
    ME={id:u.id,email:u.email||"",role:data.role,nom:data.nom||"",prenom:data.prenom||""};
    ME.name=dispName({prenom:ME.prenom,nom:ME.nom,email:ME.email});
    return ME;
  }
  async function logConnexion(){
    try{
      if(sessionStorage.getItem("arch_conn")==="1")return;
      const r=DB.doc("connexions/"+ME.id),s=await r.get(),o=s.exists?s.data():{};
      await r.set({nom:ME.nom||ME.email,prenom:ME.prenom||"",compte:ME.email,premiere:o.premiere||new Date().toISOString(),t:new Date().toISOString(),n:(+o.n||0)+1});
      sessionStorage.setItem("arch_conn","1");
    }catch(e){}
  }
  function addLogout(){
    const h=document.querySelector(".hd");if(!h||$$("#sbout"))return;
    const b=document.createElement("button");b.id="sbout";b.className="sm";b.style.marginLeft="auto";b.textContent="Se déconnecter";b.title=ME.email;
    b.onclick=async()=>{await sb.auth.signOut();location.reload()};h.appendChild(b);
  }
  function idleGuard(){
    let last=Date.now(),bar=null,dead=false,wr=0;
    const stored=()=>{try{return +localStorage.getItem(IDLE_KEY)||0}catch(e){return 0}};
    const save=()=>{try{localStorage.setItem(IDLE_KEY,String(last))}catch(e){}};
    const act=()=>{if(Date.now()-Math.max(last,stored())>=IDLE_MS)return out();last=Date.now();if(bar){bar.remove();bar=null}if(last-wr>5000){wr=last;save()}};
    save();
    ["click","keydown","touchstart","touchmove","touchend","pointerdown","mousedown","scroll","wheel","mousemove"].forEach(ev=>document.addEventListener(ev,act,{passive:true,capture:true}));
    const out=async()=>{if(dead)return;dead=true;try{await sb.auth.signOut({scope:"local"})}catch(e){}try{localStorage.removeItem(IDLE_KEY)}catch(e){}location.reload()};
    const tick=()=>{
      const idle=Date.now()-Math.max(last,stored());
      if(idle>=IDLE_MS)return out();
      if(idle>=IDLE_MS-WARN_MS){
        const s=Math.ceil((IDLE_MS-idle)/1000);
        if(!bar){bar=document.createElement("div");bar.setAttribute("role","alert");bar.setAttribute("style","position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:99999;background:#7a1f1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);font:14px system-ui,sans-serif;max-width:92vw;text-align:center");document.body.appendChild(bar)}
        bar.textContent="Inactivité : déconnexion dans "+s+" s. Bougez la souris ou touchez l’écran pour rester connecté.";
      }
    };
    setInterval(tick,1000);["visibilitychange","focus","pageshow","resume"].forEach(ev=>(ev==="visibilitychange"?document:window).addEventListener(ev,tick));
  }
  async function boot(){
    if(!window.supabase||!CFG.url||!CFG.key){overlay('<p>Impossible de charger le service de connexion. Vérifiez votre accès internet puis actualisez la page.</p>');readyRes(null);return}
    sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")newPwdView();if(ev==="SIGNED_OUT"&&ME)location.reload()});
    let {data:{session}}=await sb.auth.getSession();
    if(location.hash.includes("type=recovery")){return}   // l'écran de nouveau mot de passe est géré par l'évènement ci-dessus
    if(session){let t=0;try{t=+localStorage.getItem(IDLE_KEY)||0}catch(e){}
      if(!t||Date.now()-t>=IDLE_MS){try{await sb.auth.signOut({scope:"local"})}catch(e){}try{localStorage.removeItem(IDLE_KEY)}catch(e){}session=null}}
    if(!session){await loginView();({data:{session}}=await sb.auth.getSession())}
    try{
      if(!(await loadMe(session))){blockedView("Votre compte existe mais n'a pas encore de rôle ou a été désactivé. Contactez l'administrateur.");readyRes(null);return}
    }catch(e){blockedView("Impossible de vérifier votre compte : "+(e&&e.message||e));readyRes(null);return}
    DB=makeDB();hideOverlay();addLogout();idleGuard();readyRes(true);logConnexion();
  }
  window.PLATFORM={
    db:async()=>(await readyP)?DB:null,
    user:async()=>(await readyP)?makeUser():null,
    downloads:async()=>downloads,
    assets:async()=>(await readyP)?assets:null,
    sample:async()=>null
  };
  const start=()=>boot().catch(e=>{overlay("<p>Erreur au démarrage : "+esc(e&&e.message||e)+"</p>");readyRes(null)});
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();

</script>
<script>
/* Couche plateforme : un seul point d'entrée vers la base, les utilisateurs, les téléchargements, les fichiers et l'IA.
   Sur Claude : services de la plateforme. Ailleurs (Supabase) : window.PLATFORM = {db,user,downloads,assets,sample} fournis par un module de connexion. */
const PF={use:async k=>{try{if(window.claude&&window.claude.use)return await window.claude.use(k);const f=(window.PLATFORM||{})[k];return f?await f():null}catch(e){return null}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=new Intl.Collator("fr"),cmp=(a,b)=>COL.compare(String(a),String(b)),OCOL=new Intl.Collator("fr",{ignorePunctuation:true}),ocmp=(a,b)=>OCOL.compare(String(a),String(b));
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const nextNum=(p,a)=>{const y=new Date().getFullYear(),re=new RegExp("^"+p+"-"+y+"-(\\d+)$");return p+"-"+y+"-"+String(Math.max(0,...a.map(x=>{const m=re.exec(x.num||"");return m?+m[1]:0}))+1).padStart(3,"0")};
async function freeNum(c,p,a){let n=nextNum(p,a);for(let i=0;i<50;i++){const s=await db.doc(c+"/"+hid(n)).get();if(!s||!s.exists)return n;n=n.replace(/\d+$/,k=>String(+k+1).padStart(3,"0"))}return n}
const fmt=d=>d?esc(String(d).split("-").reverse().join("/")):"–";

const APP_VER="9 nov. 2026 – 1";

function late(p){return p.statut==="en_cours"&&p.prevu&&p.prevu<today()}
function stats(){
  const units=docs.reduce((n,d)=>n+(+d.nb||0),0),open=prets.filter(p=>p.statut==="en_cours");
  return{units,open,late:open.filter(late)};
}

function salut(){

}
function qui(s){

  const L=[...g.values()].sort((a,b)=>b.c-a.c);
  return `<div class="card"><b>Documents actuellement en sortie</b><div class="mu">${s.open.length} document(s) chez ${L.length} personne(s)</div>${L.slice(0,8).map(o=>`<div class="row" style="justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--bd)"><span>${esc(o.n)}${o.sv?` <span class="mu">(${esc(o.sv)})</span>`:""}</span><span class="${o.late?"b er":"mu"}">${o.c} doc.${o.d?" · depuis "+fmt(o.d):""}${o.late?" · "+o.late+" en retard":""}</span></div>`).join("")}${L.length>8?`<div class="mu">… et ${L.length-8} autre(s)</div>`:""}<div class="acts"><button class="sm pri" data-a="pvgo">Voir les sorties</button></div></div>`;
}

    ${pr?`<div class="mu" style="color:var(--wa)"><b>Emprunté par ${esc(pr.demandeur||"–")}</b>${pr.service?" ("+esc(pr.service)+")":""}${pr.ref?" · "+esc(pr.ref):""}${pr.sortie?" · sorti le "+fmt(pr.sortie):""}</div>`:""}

function cards(arr,full){

  arr.forEach(p=>{const k=p.grp||p.id;if(seen.has(k))return;seen.add(k);const L=p.grp?grpOf(k):[p];out.push(p.grp&&L.length>1?grpCard(k,L):pretCard(p))});

const MOISL=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function actRange(per,ref){
  const d=new Date(ref+"T12:00:00");let a,b,lab,code;
  if(per==="jour"){a=b=ref;lab="Jour : "+fmtR(ref);code="J-"+ref.replace(/-/g,"")}
  else if(per==="semaine"){const w=(d.getDay()+6)%7,x=new Date(d);x.setDate(d.getDate()-w);const y2=new Date(x);y2.setDate(x.getDate()+6);a=ymd(x);b=ymd(y2);lab="Semaine du "+fmtR(a)+" au "+fmtR(b);code="S-"+a.replace(/-/g,"")}
  else if(per==="mois"){a=ref.slice(0,8)+"01";const e=new Date(d.getFullYear(),d.getMonth()+1,0);b=ymd(e);lab="Mois de "+MOISL[d.getMonth()]+" "+d.getFullYear();code="M-"+ref.slice(0,7).replace("-","")}
  else{a=d.getFullYear()+"-01-01";b=d.getFullYear()+"-12-31";lab="Année "+d.getFullYear();code="A-"+d.getFullYear()}
  return {a,b,lab,code};
}

let pend=[];
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const SYN={direction:["direction"],service:["service"],annee:["annee","exercice"],mois:["mois"],type:["type","support","type de support","contenant","type de document"],nb:["nombre","nb","quantite","qte","unites","nombre d unites","nombre de chronos","nb chronos","volume"],cote:["cote","reference","code","code plan","cote plan"],empl:["emplacement","localisation","armoire","rayon","etagere"],mots:["mots cles","mots cle"],obs:["observations","observation","remarques","remarque","commentaire","commentaires","notes"],intitule:["intitule","designation","libelle","titre","nom du document","description","document","contenu","objet"]};
const hid=s=>{let a=5381,b=0;for(const c of s){const k=c.charCodeAt(0);a=((a<<5)+a+k)>>>0;b=(Math.imul(b,31)+k)>>>0}return "i"+a.toString(36)+b.toString(36)};
function parseSheets(wb){
  let best=null;
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:"",raw:true});
    for(let i=0;i<Math.min(rows.length,25);i++){
      const map={},used=new Set();
      rows[i].forEach((c,j)=>{const n=norm(c);if(!n||used.has(j))return;for(const k in SYN)if(map[k]===undefined&&SYN[k].some(s=>n===s||n.startsWith(s+" "))){map[k]=j;used.add(j);break}});
      if(map.direction!==undefined&&map.service!==undefined&&map.annee!==undefined){
        const rest=rows.slice(i+1),ok=r=>String(r[map.direction]).trim()&&String(r[map.service]).trim(),data=rest.filter(ok),sans=rest.filter(r=>!ok(r)&&r.some(c=>String(c??"").trim())).length;
        if(!best||data.length>best.data.length)best={name,map,data,sans};
        break;
      }
    }
  }
  return best;
}
let skipN=0;
function toEntries(b){
  skipN=0;
  const g=(r,k)=>b.map[k]===undefined?"":String(r[b.map[k]]??"").trim(),agg={};
  for(const r of b.data){
    const tn=norm(g(r,"type")),type=tn.includes("carton")?"Carton":tn.includes("chemise")?"Chemise":"Chrono";
    const o={direction:g(r,"direction"),service:g(r,"service"),annee:parseInt(g(r,"annee"))||0,mois:g(r,"mois"),type,intitule:g(r,"intitule"),nb:Math.max(1,parseInt(g(r,"nb"))||1),cote:g(r,"cote"),empl:g(r,"empl"),mots:g(r,"mots"),obs:g(r,"obs")};
    if(!o.annee||o.annee<1900||o.annee>new Date().getFullYear()+1||!o.direction||!o.service){if(r.some(c=>String(c??"").trim()))skipN++;continue}
    if(!o.intitule)o.intitule=`${type}s${o.mois?" "+o.mois:""} ${o.annee}`;
    const key=[o.direction,o.service,o.annee,o.mois,o.type,o.intitule].join("|");
    if(agg[key])agg[key].nb+=o.nb;else agg[key]={...o,id:hid(key)};
  }
  return Object.values(agg);
}

async function readXls(file){
  if(!file)return;const out=$("#imsg");
  if(file.size>5e6){out.textContent="Fichier trop volumineux (5 Mo maximum). N’importez que des fichiers de confiance.";return}
  if(!await libX()){out.textContent="La bibliothèque Excel n’a pas pu se charger. Rechargez la page.";return}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}),b=parseSheets(wb);
    if(!b){pend=[];$("#go").disabled=true;out.innerHTML="Aucune feuille avec les colonnes <b>Direction</b>, <b>Service</b> et <b>Année</b> n’a été trouvée. Feuilles lues : "+esc(wb.SheetNames.join(", "));return}
    const all=toEntries(b),have=new Set(docs.map(d=>d.id));skipN+=b.sans||0;
    pend=all.filter(e=>!have.has(e.id));
    out.innerHTML=`Feuille « ${esc(b.name)} » : ${b.data.length} lignes, soit ${all.length} entrées (${all.reduce((n,e)=>n+e.nb,0)} unités).<br>Déjà présentes : ${all.length-pend.length}. À importer : <b>${pend.length}</b>.${skipN?`<br><span style="color:var(--wa)">Lignes ignorées (année invalide, direction ou service manquant) : <b>${skipN}</b>.</span>`:""}`;
    $("#go").disabled=!pend.length;
  }catch(e){out.textContent="Fichier illisible : "+e.message}
}
async function doImp(){
  $("#go").disabled=true;const out=$("#imsg");
  try{
    for(let i=0;i<pend.length;i+=10){
      await Promise.all(pend.slice(i,i+10).map(({id,...o})=>db.doc("docs/"+id).set({...o,statut:"disponible"})));
      out.textContent=`Import en cours… ${Math.min(pend.length,i+10)} / ${pend.length}`;
    }
    jr("Import Excel",pend.length+" entrée(s)");out.textContent=`Terminé : ${pend.length} entrées importées.`;pend=[];
  }catch(e){out.textContent="Import interrompu : "+(e&&e.message||e)+". Relancez : les entrées déjà écrites seront ignorées.";$("#go").disabled=false}
}
