/* ===== Design 2026 : élégant et futuriste ===== */
:root{--bg:#f2f4fb;--cd:#fff;--tx:#0e1430;--mu:#5b6384;--bd:#e1e5f2;--ac:#3346d3;--as:#eceffd;--or:#f0621f;--ok:#178a52;--wa:#b45309;--er:#c2352b;--fill:#3346d3;--fill2:#6d4af2;--glass:rgba(255,255,255,.74);--gbd:rgba(210,216,240,.8);--sh:0 1px 2px rgba(16,24,64,.05),0 8px 24px -10px rgba(16,24,64,.14);--sh2:0 2px 6px rgba(16,24,64,.06),0 22px 44px -14px rgba(16,24,64,.26);--glow:0 8px 22px -8px rgba(98,78,240,.65);--rd:18px;--a1:rgba(80,96,255,.15);--a2:rgba(240,98,31,.09);--a3:rgba(140,80,255,.11);--ff:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a1b;--cd:#0d1330;--tx:#e8ebff;--mu:#97a0c9;--bd:rgba(148,163,255,.15);--ac:#97a3ff;--as:rgba(120,136,255,.13);--or:#ff7a3d;--ok:#4ed18c;--wa:#f2b35c;--er:#ff8b80;--fill:#4e5cff;--fill2:#8b4dff;--glass:rgba(12,18,46,.72);--gbd:rgba(148,163,255,.16);--sh:inset 0 1px 0 rgba(255,255,255,.04),0 12px 30px -14px rgba(0,0,0,.7);--sh2:inset 0 1px 0 rgba(255,255,255,.06),0 24px 50px -16px rgba(0,0,0,.8);--glow:0 8px 26px -6px rgba(120,90,255,.7);--a1:rgba(78,92,255,.26);--a2:rgba(255,122,61,.10);--a3:rgba(139,77,255,.20)}}
:root[data-theme="dark"]{--bg:#060a1b;--cd:#0d1330;--tx:#e8ebff;--mu:#97a0c9;--bd:rgba(148,163,255,.15);--ac:#97a3ff;--as:rgba(120,136,255,.13);--or:#ff7a3d;--ok:#4ed18c;--wa:#f2b35c;--er:#ff8b80;--fill:#4e5cff;--fill2:#8b4dff;--glass:rgba(12,18,46,.72);--gbd:rgba(148,163,255,.16);--sh:inset 0 1px 0 rgba(255,255,255,.04),0 12px 30px -14px rgba(0,0,0,.7);--sh2:inset 0 1px 0 rgba(255,255,255,.06),0 24px 50px -16px rgba(0,0,0,.8);--glow:0 8px 26px -6px rgba(120,90,255,.7);--a1:rgba(78,92,255,.26);--a2:rgba(255,122,61,.10);--a3:rgba(139,77,255,.20)}
:root{color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
body{font-family:var(--ff);font-size:15px;letter-spacing:-.006em;background:var(--bg);isolation:isolate;min-height:100vh;min-height:100dvh;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70vw 55vh at -5% -10%,var(--a1),transparent 70%),radial-gradient(55vw 45vh at 105% -5%,var(--a2),transparent 70%),radial-gradient(65vw 55vh at 85% 105%,var(--a3),transparent 70%)}
::selection{background:color-mix(in srgb,var(--fill2) 30%,transparent)}
h1,h2,h4{font-family:var(--fd)}
h2{font-size:22px;font-weight:700;letter-spacing:-.025em;margin:2px 0 12px}
h3{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--tx);border:0;padding:0 0 0 14px;position:relative;margin:24px 0 10px}
h3::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:4px;background:linear-gradient(var(--fill2),var(--or))}
h5{letter-spacing:.08em;font-weight:700}
.mu{color:var(--mu)}
a{color:var(--ac)}
/* Boutons et champs */
button{background:var(--cd);border:1px solid var(--bd);border-radius:12px;font-weight:500;transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background-color .2s,border-color .2s,color .2s,filter .2s;-webkit-tap-highlight-color:transparent}
button:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd));box-shadow:var(--sh)}
button.on,button.pri,nav button.on{background:linear-gradient(135deg,var(--fill),var(--fill2));border-color:transparent;color:#fff;box-shadow:var(--glow);font-weight:600}
button.pri:hover,button.on:hover{filter:brightness(1.08) saturate(1.05)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
input,select,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:12px}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--ac) 30%,var(--bd))}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
label{font-weight:500}
/* Cartes, indicateurs, pastilles */
.card,.kpi{background:var(--cd);border:1px solid var(--bd);border-radius:var(--rd);box-shadow:var(--sh)}
.card{padding:14px 16px}
@media(hover:hover){.card:hover{box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--ac) 28%,var(--bd))}}
.card.late{border:1px solid color-mix(in srgb,var(--er) 45%,var(--bd));border-left:4px solid var(--er)}
.kpis{gap:12px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;padding:16px 16px 14px;border-left:1px solid var(--bd)}
.kpi:nth-child(2){border-left-color:var(--bd)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--fill),var(--fill2))}
.kpi:nth-child(4n+2)::before{background:linear-gradient(90deg,var(--or),#ffb36b)}
.kpi:nth-child(4n+3)::before{background:linear-gradient(90deg,#0ea5a4,#38bdf8)}
.kpi:nth-child(4n)::before{background:linear-gradient(90deg,#8b4dff,#e879f9)}
.kpi b{font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--tx);margin-top:2px}
.kpi span,.kpi .mu{font-weight:600;letter-spacing:.06em;color:var(--mu)}
@media(hover:hover){button.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}}
.b{border-radius:999px;padding:2px 10px;font-weight:600;font-size:11.5px;background:var(--as);color:var(--ac);border:1px solid color-mix(in srgb,currentColor 16%,transparent)}
.b.ok{background:color-mix(in srgb,var(--ok) 12%,transparent)}.b.wa{background:color-mix(in srgb,var(--wa) 13%,transparent)}.b.er{background:color-mix(in srgb,var(--er) 12%,transparent)}
.bar{height:8px;border-radius:99px;background:var(--as);overflow:hidden}.bar i{border-radius:99px;background:linear-gradient(90deg,var(--or),#ff9f5a)}
.tb th{background:var(--as)}.tb th,.tb td{border-color:var(--bd)}
.sk{background:linear-gradient(90deg,var(--as) 25%,color-mix(in srgb,var(--as) 40%,var(--cd)) 50%,var(--as) 75%);background-size:200% 100%}
/* Structure : en-tête et menu */
main{max-width:none;width:100%;margin:0;padding:0}
.side{display:contents}
#app{min-width:0;padding:14px 14px calc(112px + env(safe-area-inset-bottom,0px))}
.hd{position:relative;display:flex;align-items:center;gap:12px;margin:10px 12px 0;padding:10px 10px 10px 12px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--gbd);border-bottom:1px solid var(--gbd);border-radius:20px;box-shadow:var(--sh);color:var(--tx)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hd{background:var(--glass)}}
.hd img{height:40px;width:auto;background:#fff;border-radius:12px;padding:5px 9px;box-shadow:0 1px 3px rgba(16,24,64,.12)}
.hdt{flex:1;min-width:0}
.thm.out:hover{color:var(--er);border-color:color-mix(in srgb,var(--er) 40%,var(--bd))}
@media(max-width:430px){.hd{gap:7px;padding:8px 8px 8px 10px}.hd .hdt{display:none}.hd img{height:36px;padding:4px 8px}.hd .thm{width:38px;height:38px;min-height:38px;border-radius:12px}.hd .cmdb{margin-left:auto}}
@media(max-width:350px){.hd img{height:30px;padding:3px 6px}.hd .thm{width:34px;height:34px;min-height:34px}}
.hd h1{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .mu{color:var(--mu);font-size:12.5px;line-height:1.35}
.thm{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:42px;height:42px;min-height:42px;padding:0;border-radius:14px;background:var(--cd);color:var(--mu)}
.thm .ni{width:20px;height:20px}.thm .tl{display:none}
.ni{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;left:10px;right:10px;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;margin:0;padding:6px;display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:2px;overflow-x:auto;overscroll-behavior-x:contain;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--gbd);border-radius:24px;box-shadow:var(--sh2);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{position:relative;flex:1 0 auto;min-width:68px;min-height:56px;padding:7px 8px 6px;margin:0;border:0;background:transparent;box-shadow:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:0;color:var(--mu);white-space:nowrap}
@media(hover:hover){nav button:not(.on):hover{box-shadow:none;color:var(--tx);background:var(--as)}}
nav button .ni{width:22px;height:22px}
nav button .nl{display:none}nav button .ns{display:block}
nav button.on{color:#fff;box-shadow:var(--glow)}
nav button.on:hover{color:#fff;background:linear-gradient(135deg,var(--fill),var(--fill2))}
.nbg{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--or);color:#fff;font:700 10.5px/18px var(--ff);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--cd)}
#fab{right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--or),#ff3d6e);box-shadow:0 12px 28px -8px color-mix(in srgb,var(--or) 75%,transparent);font-weight:400}
#fab:hover{filter:brightness(1.07)}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:14px;background:#141a3a;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
/* Fenêtres */
dialog{background:var(--bg);border:1px solid var(--gbd);box-shadow:var(--sh2),0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(6,10,27,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog>.acts:last-child,dialog>.acts:last-of-type{background:var(--bg)}
dialog h2{font-size:21px}
@media(max-width:599px){dialog:not(.ask){border-bottom:0}dialog:not(.ask)::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--bd);margin:-6px auto 12px}}
/* Ordinateur : barre latérale */
@media(min-width:1024px){
main{display:grid;grid-template-columns:268px minmax(0,1fr);align-items:start}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:18px 4px 18px 18px;scrollbar-width:thin}
.hd{margin:0;flex-direction:column;align-items:stretch;gap:12px;padding:16px}
.hd img{height:auto;width:100%;max-width:100%;padding:8px 14px;object-fit:contain}
.hd h1{font-size:18px;white-space:normal}
.hd{display:grid;grid-template-columns:1fr 1fr}.hd>img,.hd>.hdt{grid-column:1/-1}
.thm{width:100%;height:38px;min-height:38px;justify-content:center;padding:0 10px;font-size:13px;font-weight:600;border-radius:12px}.thm .tl{display:inline}.thm:only-of-type{grid-column:1/-1}
nav{position:static;flex-direction:column;flex-wrap:nowrap;gap:3px;padding:8px;margin:0;overflow:visible;border-radius:20px;box-shadow:var(--sh)}
nav button{flex:0 0 auto;width:100%;min-width:0;min-height:44px;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;font-size:14px;font-weight:500;border-radius:14px;text-align:left}
nav button .ni{width:20px;height:20px}
nav button .nl{display:block}nav button .ns{display:none}
nav button.on{font-weight:600}
.nbg{position:static;margin-left:auto;box-shadow:none}
nav button.on .nbg{background:rgba(255,255,255,.25)}
#app{padding:26px clamp(20px,2.6vw,48px) 56px 18px}
#fab{bottom:calc(28px + env(safe-area-inset-bottom,0px));right:28px}
#toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
@media(min-width:1024px) and (max-height:720px){.hd .mu{display:none}.hd img{padding:6px 12px}nav button{min-height:38px;padding:7px 12px}}
@media(min-width:600px) and (max-width:1023px){#app{padding-left:20px;padding-right:20px}nav{left:50%;right:auto;transform:translateX(-50%);max-width:calc(100vw - 20px)}}
/* GED */
.gtabs{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--gbd);border-radius:16px;padding:5px;gap:3px}
.gtab{border-radius:12px;color:var(--mu);font-weight:600;transition:background-color .2s,color .2s}
.gtab:hover{color:var(--tx);background:var(--as)}
.gtab.on,.gtab.on:hover{background:linear-gradient(135deg,var(--fill),var(--fill2));color:#fff;box-shadow:var(--glow)}
.gnav{border-radius:20px;padding:12px;background:var(--cd)}
@media(min-width:861px){.gnav{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin}}
.gnav summary{border-radius:12px;transition:background-color .15s}
.gnav summary:hover,.gsv:hover{background:var(--as)}
.gsv{border-radius:12px;transition:background-color .15s,color .15s}
.gsv.on,.gsv.on:hover{background:linear-gradient(135deg,var(--fill),var(--fill2));color:#fff;box-shadow:var(--glow)}
.gct{background:var(--as);color:var(--ac)}.gsv.on .gct{background:rgba(255,255,255,.22);color:#fff}
.gquota .bar i{background:linear-gradient(90deg,var(--fill),var(--fill2))}
.gfold{border-radius:16px;padding:14px;background:var(--cd);transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
@media(hover:hover){.gfold:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}}
.gfi{background:linear-gradient(135deg,#ffb347,var(--or));border-radius:6px;opacity:1;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--or) 80%,transparent)}.gfi:before{background:#ffb347}
.gk{border-radius:13px;background:linear-gradient(135deg,#64748b,#475569);box-shadow:0 6px 14px -8px rgba(0,0,0,.45);font-family:var(--fd)}
.gk-PDF{background:linear-gradient(135deg,#f0564e,#b42318)}.gk-IMG{background:linear-gradient(135deg,#a78bfa,#6d28d9)}.gk-DOC{background:linear-gradient(135deg,#60a5fa,#1d4ed8)}.gk-XLS{background:linear-gradient(135deg,#34d399,#15803d)}.gk-PPT{background:linear-gradient(135deg,#fbbf24,#c2410c)}
.gempty{border:1.5px dashed color-mix(in srgb,var(--ac) 35%,var(--bd));border-radius:18px;background:color-mix(in srgb,var(--as) 50%,transparent)}
.gu{border-radius:14px;transition:border-color .15s,background-color .15s}.gu:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.gu.on{background:linear-gradient(135deg,var(--fill),var(--fill2));border-color:transparent;box-shadow:var(--glow)}
.gad{border-radius:18px}.gad>.gar:first-child{background:var(--as)}
.gtb th{color:var(--mu);border-bottom-color:var(--bd)}.gtb tr:hover td{background:color-mix(in srgb,var(--as) 60%,transparent)}
.glink{color:var(--ac)}
/* Écran de connexion */
#sbauth{background:var(--bg)!important;isolation:isolate}
#sbauth::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70vw 60vh at 0% 0%,var(--a1),transparent 70%),radial-gradient(60vw 50vh at 100% 100%,var(--a3),transparent 70%),radial-gradient(40vw 40vh at 100% 0%,var(--a2),transparent 70%)}
#sbauth>div{background:var(--glass)!important;-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--gbd);border-top:1px solid var(--gbd)!important;border-radius:26px!important;box-shadow:var(--sh2)!important;padding:28px 26px!important}
#sbauth h1{font-family:var(--fd);letter-spacing:-.025em}
#sbauth .sblogo{display:block;height:46px;width:auto;max-width:100%;background:#fff;border-radius:14px;padding:6px 12px;margin:0 0 18px;box-shadow:0 1px 3px rgba(16,24,64,.12)}
#sbauth .acts button{flex:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* Recherche rapide, transitions, bouton flottant */
.cmdb{flex:0 0 auto}
.cmdb .kb{display:none;margin-left:auto;font:600 11px/1 var(--ff);color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:3px 6px}
dialog.cmdk{width:min(640px,94vw);max-height:min(560px,80vh);padding:0;margin:10vh auto auto;overflow:hidden;display:none;flex-direction:column;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);animation:cmdin .16s cubic-bezier(.2,.8,.2,1)}
dialog.cmdk[open]{display:flex}
dialog.cmdk::before{display:none!important}
@keyframes cmdin{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.cmdh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.cmdh .ni{width:20px;height:20px;color:var(--mu)}
.cmdh input{border:0;background:transparent;box-shadow:none!important;font-size:17px;min-height:40px;padding:6px 2px}
.cmdh input:focus{box-shadow:none}
.cmdx{min-height:30px;padding:4px 8px;font-size:12px;border-radius:8px;color:var(--mu);flex:0 0 auto}
.cmdr{overflow-y:auto;padding:6px 8px 8px;flex:1;overscroll-behavior:contain}
.cmdg{font:700 11px/1 var(--ff);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:12px 10px 6px}
.cmdi{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;background:transparent;box-shadow:none;border-radius:12px;padding:9px 10px;min-height:46px;color:var(--tx)}
.cmdi .ni{width:20px;height:20px;color:var(--mu)}
.cmdi:hover{background:var(--as);box-shadow:none}
.cmdi.on{background:linear-gradient(135deg,var(--fill),var(--fill2));color:#fff;box-shadow:var(--glow)}
.cmdi.on .ni,.cmdi.on small{color:rgba(255,255,255,.85)}
.cmdt{display:flex;flex-direction:column;min-width:0}.cmdt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cmdt small{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmde{padding:26px 14px;text-align:center;color:var(--mu)}
.cmdf{display:flex;gap:16px;justify-content:flex-end;padding:8px 14px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--mu)}
@media(max-width:599px){dialog.cmdk{width:100vw;max-width:100vw;margin:0 0 auto;max-height:85vh;border-radius:0 0 22px 22px;animation:cmdtop .2s ease-out}.cmdf{display:none}}
@keyframes cmdtop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:1024px){.cmdb{grid-column:1/-1;justify-content:flex-start!important}.cmdb .kb{display:inline-block}}
#fab{transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s,filter .2s}
#fab.hid{transform:translateY(130%) scale(.85);opacity:0;pointer-events:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
nav{view-transition-name:menu}.hd{view-transition-name:entete}
::view-transition-group(menu),::view-transition-group(entete){animation-duration:0s}
/* Graphique des entrées par année, étoiles de la GED */
.ych{padding:14px 14px 10px}
.ycw{display:flex;align-items:stretch;gap:3px;height:180px}
.ycb{flex:1 1 0;min-width:0;max-width:72px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;padding:0;border:0;background:transparent;box-shadow:none;border-radius:6px;position:relative;min-height:0}
.ycp{flex:1 1 auto;position:relative;min-height:0}
.ycb i{position:absolute;left:0;right:0;bottom:0;display:block;background:color-mix(in srgb,var(--fill) 78%,var(--cd));border-radius:4px 4px 0 0;transition:background-color .15s;min-height:0}

<script>
/* ===== Connexion Supabase : remplace les services de la plateforme Claude =====
   Fournit window.PLATFORM = {db, user, downloads, assets, sample} utilisé par le reste de l'application.
   Seules la clé PUBLIQUE (publishable) et l'adresse du projet sont ici : elles ne donnent aucun droit par elles-mêmes,
   tout est contrôlé côté serveur (RLS). Ne mettez JAMAIS la clé « service_role » dans cette page. */
(function(){
  const CFG=window.SB_CONFIG||{};
  window.PLATFORM_SB=true;
  const ROLE_FN={admin:"Administrateur",archiviste:"Archiviste",responsable:"Responsable de service",demandeur:"Demandeur",lecteur:"Lecteur"};
  const FN_ROLE=Object.fromEntries(Object.entries(ROLE_FN).map(([k,v])=>[v,k]));
  const WRITERS=["admin","archiviste","responsable","demandeur"];
  const IDLE_MS=30*60*1000,WARN_MS=30*1000,IDLE_KEY="nitaLastActivity";
  let sb=null,ME=null,DB=null,readyRes,readyP=new Promise(r=>readyRes=r);
  const $$=s=>document.querySelector(s);
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const newId=()=>{const a=new Uint8Array(15);crypto.getRandomValues(a);return Array.from(a,b=>"abcdefghijklmnopqrstuvwxyz0123456789"[b%36]).join("")};
  const mkErr=e=>{const m=(e&&e.message)||"Erreur";const x=new Error(/row-level security|permission denied|droit insuffisant/i.test(m)||(e&&e.code==="42501")?"Droit insuffisant pour cette action.":m);x.code=(e&&(e.code==="42501"||/row-level security|permission denied/i.test(m)))?"not_granted":(e&&e.code)||"erreur";return x};
  const fr=m=>/Invalid login credentials/i.test(m)?"E-mail ou mot de passe incorrect.":/rate limit|too many/i.test(m)?"Trop de tentatives : patientez quelques minutes.":/Email not confirmed/i.test(m)?"Compte non confirmé : contactez l'administrateur.":/network|fetch/i.test(m)?"Connexion au serveur impossible : vérifiez votre accès internet.":m;

  /* Face ID / empreinte (passkey, vérifiée par le serveur) */
  const PK_OK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
  const pkErr=e=>{const c=(e&&(e.code||e.error_code))||"",m=(e&&e.message)||String(e||"");
    if(/passkey_disabled/i.test(c+m))return "La connexion par Face ID / empreinte n’est pas encore activée par l’administrateur.";
    if(/NotAllowed|abort|cancel|ERROR_CEREMONY_ABORTED|timed out/i.test(c+m+(e&&e.name||"")))return "Vérification annulée ou expirée. Réessayez.";
    if(/credential_not_found/i.test(c+m))return "Aucune empreinte / Face ID enregistrée pour ce compte sur cet appareil. Connectez-vous avec le mot de passe puis activez-la dans « Mon compte ».";
    if(/credential_exists/i.test(c+m))return "Cet appareil est déjà enregistré pour votre compte.";
    if(/not support/i.test(m))return "Ce navigateur ne permet pas Face ID / empreinte.";
    return fr(m)};
  window.SBPK={ok:PK_OK,err:pkErr};

  /* ---------- Écran de connexion ---------- */
  function overlay(html){
    let o=$$("#sbauth");
    if(!o){o=document.createElement("div");o.id="sbauth";o.style.cssText="position:fixed;inset:0;z-index:100;background:var(--bg,#f3f4f9);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto";document.body.appendChild(o)}
    o.innerHTML=`<div style="width:min(420px,100%);background:var(--cd,#fff);color:var(--tx,#1b1f33);border-radius:18px;box-shadow:0 10px 40px rgba(20,25,60,.18);padding:24px;border-top:5px solid var(--or,#E8561A)">${(()=>{const i=document.querySelector(".hd img");return i&&i.src?`<img class="sblogo" alt="" src="${i.src}">`:""})()}<h1 style="margin:0 0 4px;font-size:22px">Archives – NITA SA</h1><div class="mu" style="margin-bottom:14px">Service Archivage · accès réservé</div>${html}</div>`;
    return o;
  }
  const hideOverlay=()=>{const o=$$("#sbauth");if(o)o.remove()};
  function loginView(msg){
    return new Promise(res=>{
      const o=overlay(`<label for="sb_em">Adresse e-mail</label><input id="sb_em" type="email" autocomplete="username" inputmode="email"><label for="sb_pw">Mot de passe</label><input id="sb_pw" type="password" autocomplete="current-password"><div id="sb_msg" class="mu" style="color:var(--er,#b3261e);min-height:20px;margin:8px 0">${esc(msg||"")}</div><div class="acts"><button class="pri" id="sb_go">Se connecter</button></div>${PK_OK()?`<div class="pkor"><span>ou</span></div><button id="sb_pk" class="pkb" type="button"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M12 11v3m-4.5-5.5A6 6 0 0 1 18 12c0 2.5-.4 4.6-1.2 6.4M6 12a6 6 0 0 0 .2 1.6M9 12a3 3 0 0 1 6 0c0 3-.6 5.6-1.8 7.8M9 14.8c-.2 1.9-.8 3.6-1.8 5M4.8 7.8A9 9 0 0 1 21 12"/></svg> Face ID / empreinte</button>`:""}<p style="margin:14px 0 0"><a href="#" id="sb_forgot" style="color:var(--ac,#25348A)">Mot de passe oublié ?</a></p>`);
      const msgEl=o.querySelector("#sb_msg");
      const go=async()=>{
        const email=o.querySelector("#sb_em").value.trim(),password=o.querySelector("#sb_pw").value;
        if(!email||!password){msgEl.textContent="Saisissez votre e-mail et votre mot de passe.";return}
        let F={n:0,t:0};try{F=JSON.parse(sessionStorage.getItem("arch_echecs")||'{"n":0,"t":0}')}catch(e){}const wait=F.n>=3?Math.min(60,5*2**(F.n-3))*1000-(Date.now()-F.t):0;
        if(wait>0){msgEl.style.color="var(--er,#b3261e)";msgEl.textContent="Trop d’essais incorrects : patientez "+Math.ceil(wait/1000)+" s avant de réessayer.";return}
        const b=o.querySelector("#sb_go");b.disabled=true;msgEl.textContent="Connexion…";msgEl.style.color="var(--mu,#5f6580)";
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error){F.n++;F.t=Date.now();try{sessionStorage.setItem("arch_echecs",JSON.stringify(F))}catch(e){}b.disabled=false;msgEl.style.color="var(--er,#b3261e)";msgEl.textContent=fr(error.message)+(F.n>=3?" Par sécurité, chaque nouvel essai demandera un délai.":"");return}
        try{sessionStorage.removeItem("arch_echecs")}catch(e){}res();
      };
      o.querySelector("#sb_go").onclick=go;
      const pk=o.querySelector("#sb_pk");if(pk)pk.onclick=async()=>{pk.disabled=true;msgEl.style.color="var(--mu,#5f6580)";msgEl.textContent="Vérification Face ID / empreinte…";
        try{const {error}=await sb.auth.signInWithPasskey();if(error)throw error;try{sessionStorage.removeItem("arch_echecs")}catch(e){}res()}
        catch(e){pk.disabled=false;msgEl.style.color="var(--er,#b3261e)";msgEl.textContent=pkErr(e)}};
      o.querySelector("#sb_pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
      o.querySelector("#sb_forgot").onclick=async e=>{e.preventDefault();const email=o.querySelector("#sb_em").value.trim();
        if(!email){msgEl.style.color="var(--er,#b3261e)";msgEl.textContent="Saisissez d'abord votre e-mail ci-dessus.";return}
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
        msgEl.style.color=error?"var(--er,#b3261e)":"var(--ok,#1b7a4a)";msgEl.textContent=error?fr(error.message):"Si ce compte existe, un e-mail de réinitialisation vient d'être envoyé."};
      setTimeout(()=>o.querySelector("#sb_em").focus(),50);
    });
  }
  function newPwdView(){
    const o=overlay(`<p>Choisissez un nouveau mot de passe (8 caractères minimum, avec au moins une majuscule, une minuscule et un chiffre).</p><label for="sb_n1">Nouveau mot de passe</label><input id="sb_n1" type="password" autocomplete="new-password"><label for="sb_n2">Confirmez</label><input id="sb_n2" type="password" autocomplete="new-password"><div id="sb_msg" class="mu" style="color:var(--er,#b3261e);min-height:20px;margin:8px 0"></div><div class="acts"><button class="pri" id="sb_ok">Enregistrer</button></div>`);
    o.querySelector("#sb_ok").onclick=async()=>{
      const a=o.querySelector("#sb_n1").value,b=o.querySelector("#sb_n2").value,m=o.querySelector("#sb_msg");
      if(a.length<8||!/[a-z]/.test(a)||!/[A-Z]/.test(a)||!/[0-9]/.test(a)){m.textContent="8 caractères minimum, avec au moins une majuscule, une minuscule et un chiffre.";return}
      if(a!==b){m.textContent="Les deux mots de passe sont différents.";return}
      const {error}=await sb.auth.updateUser({password:a});
      if(error){m.textContent=fr(error.message);return}
      location.href=location.origin+location.pathname;
    };
  }
  function blockedView(text){
    const o=overlay(`<p>${esc(text)}</p><div class="acts"><button id="sb_out">Se déconnecter</button></div>`);
    o.querySelector("#sb_out").onclick=async()=>{await sb.auth.signOut();if(window.localWipe)try{await window.localWipe()}catch(e){}location.reload()};
  }

  /* ---------- Base de données (même interface que la plateforme Claude) ---------- */
  const regs={};                                   // collection -> ensemble d'écouteurs (pour les écritures locales)
  const applyLocal=(c,id,data)=>{(regs[c]||[]).forEach(r=>r.apply(id,data))};
  function docsCollection(c){
    const ref=id=>docRef(c,id||newId());
    return {
      doc:ref,
      get:async()=>{const rows=await fetchAll(c);return {docs:rows.map(r=>({id:r.id,data:()=>r.data}))}},
      onSnapshot(cb,errcb){
        const cache=new Map();let timer=0,dead=false,ch=null;
        const emit=()=>{if(dead||timer)return;timer=setTimeout(()=>{timer=0;if(!dead)cb({docs:[...cache.entries()].map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))}))})},30)};
        const reg={apply(id,data){if(data===null)cache.delete(id);else cache.set(id,data);emit()},merge(id,patch){if(!cache.has(id))return false;cache.set(id,{...cache.get(id),...patch});emit();return true}};
        (regs[c]=regs[c]||new Set()).add(reg);
        const load=async()=>{try{const rows=await fetchAll(c);cache.clear();rows.forEach(r=>cache.set(r.id,r.data));emit()}catch(e){if(errcb)errcb(mkErr(e))}};
        load();
        if(c!=="fichiers_data"){
          try{
            ch=sb.channel("rt-"+c+"-"+newId()).on("postgres_changes",{event:"*",schema:"public",table:"documents",filter:"collection=eq."+c},p=>{
              if(p.eventType==="DELETE"){cache.delete(p.old&&p.old.id);emit()}else if(p.new&&p.new.id){cache.set(p.new.id,p.new.data);emit()}
            }).subscribe(st=>{if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")setTimeout(load,4000)});
          }catch(e){}
        }
        let hid=0;const vis=()=>{if(document.visibilityState==="hidden"){hid=Date.now();return}if(Date.now()-hid>60000)load()};document.addEventListener("visibilitychange",vis);
        return ()=>{dead=true;regs[c].delete(reg);document.removeEventListener("visibilitychange",vis);try{ch&&sb.removeChannel(ch)}catch(e){}};
      }
    };
  }
  async function fetchAll(c){
    const pg=from=>sb.from("documents").select("id,data").eq("collection",c).order("id").range(from,from+999);
    if(c==="docs"){                                   // grosse collection : les 2 premières pages en parallèle
      const [a,b]=await Promise.all([pg(0),pg(1000)]);
      if(a.error)throw a.error;const out=[...a.data];if(a.data.length<1000)return out;
      if(b.error)throw b.error;out.push(...b.data);
      for(let from=2000;b.data.length===1000;from+=1000){const r=await pg(from);if(r.error)throw r.error;out.push(...r.data);if(r.data.length<1000)break}
      return out;
    }
    const out=[];for(let from=0;;from+=1000){
      const {data,error}=await pg(from);
      if(error)throw error;out.push(...data);if(data.length<1000)break;
    }
    return out;
  }
  function docRef(c,id){
    return {
      id,
      async set(o){
        const data=JSON.parse(JSON.stringify(o));
        let {error}=await sb.from("documents").insert({collection:c,id,data});
        if(error&&error.code==="23505"){                       // existe déjà : remplacement (comme sur la plateforme Claude)
          const r=await sb.from("documents").update({data}).eq("collection",c).eq("id",id).select("id");
          if(r.error)throw mkErr(r.error);if(!r.data||!r.data.length)throw mkErr({code:"42501"});error=null;
        }
        if(error)throw mkErr(error);
        applyLocal(c,id,data);
      },
      async update(patch){
        const p=JSON.parse(JSON.stringify(patch));
        const {data,error}=await sb.rpc("merge_doc",{p_collection:c,p_id:id,p_patch:p});
        if(error)throw mkErr(error);
        if(!data)throw mkErr({code:"42501",message:"Document introuvable ou droit insuffisant."});
        // mise à jour locale sans nouvel aller-retour réseau (fusion superficielle, comme « data || patch » côté serveur)
        let done=false;(regs[c]||[]).forEach(r=>{if(r.merge&&r.merge(id,p))done=true});
        if(!done){const g=await sb.from("documents").select("data").eq("collection",c).eq("id",id).maybeSingle();if(g.data)applyLocal(c,id,g.data.data)}
      },
      async delete(){
        const {data,error}=await sb.from("documents").delete().eq("collection",c).eq("id",id).select("id");
        if(error)throw mkErr(error);
        if(!data||!data.length)throw mkErr({code:"42501",message:"Suppression refusée."});
        applyLocal(c,id,null);
      },
      async get(){
        const {data,error}=await sb.from("documents").select("data").eq("collection",c).eq("id",id).maybeSingle();
        if(error)throw mkErr(error);
        return {exists:!!data,data:()=>data?data.data:undefined};
      }
    };
  }
  /* « membres » = table members (comptes et rôles) */
  const mrow=r=>({uid:r.user_id,fonction:ROLE_FN[r.role]||r.role,nom:r.nom||"",prenom:r.prenom||"",actif:r.actif!==false});
  function membersCollection(){
    return {
      doc:id=>memberRef(id),
      onSnapshot(cb,errcb){
        let dead=false;
        const load=async()=>{
          const {data,error}=await sb.from("members").select("user_id,role,nom,prenom,actif");
          if(dead)return;if(error){if(errcb)errcb(mkErr(error));return}
          cb({docs:data.map(r=>({id:r.user_id,data:()=>mrow(r)}))});
        };
        load();const reg={apply(){load()}};(regs.membres=regs.membres||new Set()).add(reg);
        let hid=0;const vis=()=>{if(document.visibilityState==="hidden"){hid=Date.now();return}if(Date.now()-hid>60000)load()};document.addEventListener("visibilitychange",vis);
        return ()=>{dead=true;regs.membres.delete(reg);document.removeEventListener("visibilitychange",vis)};
      }
    };
  }
  function memberRef(id){
    const done=()=>(regs.membres||[]).forEach(r=>r.apply());
    return {
      id,
      async set(o){
        const role=FN_ROLE[o.fonction]||"lecteur",uid=o.uid||id;
        const {error}=await sb.from("members").upsert({user_id:uid,role,nom:o.nom||"",prenom:o.prenom||"",actif:o.actif!==false},{onConflict:"user_id"});
        if(error)throw mkErr(error);done();
      },
      async update(p){
        const u={};if(p.fonction)u.role=FN_ROLE[p.fonction]||"lecteur";if("actif" in p)u.actif=!!p.actif;if("nom" in p)u.nom=p.nom;if("prenom" in p)u.prenom=p.prenom;
        const {data,error}=await sb.from("members").update(u).eq("user_id",id).select("user_id");
        if(error)throw mkErr(error);if(!data||!data.length)throw mkErr({code:"42501"});done();
      },
      async delete(){
        const {data,error}=await sb.from("members").delete().eq("user_id",id).select("user_id");
        if(error)throw mkErr(error);if(!data||!data.length)throw mkErr({code:"42501"});done();
      },
      async get(){const {data}=await sb.from("members").select("user_id,role,nom,prenom,actif").eq("user_id",id).maybeSingle();return {exists:!!data,data:()=>data?mrow(data):undefined}}
    };
  }
  function makeDB(){
    return {
      collection:c=>c==="membres"?membersCollection():docsCollection(c),
      doc(path){const p=String(path).split("/");if(p.length!==2)throw new Error("chemin non pris en charge : "+path);return p[0]==="membres"?memberRef(p[1]):docRef(p[0],p[1])}
    };
  }

  /* ---------- Utilisateur ---------- */
  let annuaireCache=null,annuaireT=0;
  async function annuaire(){
    if(!ME||ME.role!=="admin")return [];
    if(annuaireCache&&Date.now()-annuaireT<30000)return annuaireCache;
    const {data,error}=await sb.rpc("annuaire");if(error)return annuaireCache||[];
    annuaireCache=data||[];annuaireT=Date.now();return annuaireCache;
  }
  const dispName=r=>((r.prenom||"")+" "+(r.nom||"")).trim()||r.email||"";
  function makeUser(){
    return {
      me:async()=>({id:ME.id,name:ME.name,email:ME.email,fonction:ROLE_FN[ME.role]||""}),
      id:async()=>ME.id,
      isOwner:async()=>ME.role==="admin",
      canEdit:async()=>ME.role==="admin",
      can:async n=>n==="data.write"?WRITERS.includes(ME.role):true,
      profiles:async ids=>{
        const out={};ids.forEach(i=>out[i]={name:""});out[ME.id]={name:ME.name};
        if(ME.role==="admin"){(await annuaire()).forEach(r=>{if(out[r.user_id])out[r.user_id]={name:dispName(r)}})}
        return out;
      },
      search:async q=>{
        q=String(q||"").trim().toLowerCase();if(ME.role!=="admin"||q.length<2)return [];
        annuaireT=0;
        return (await annuaire()).filter(r=>!r.role&&((r.email||"").toLowerCase().includes(q)||dispName(r).toLowerCase().includes(q))).map(r=>({id:r.user_id,name:r.email||dispName(r)}));
      },
      annuaire
    };
  }

  /* ---------- Téléchargements ---------- */
  const MIME={csv:"text/csv;charset=utf-8",json:"application/json",txt:"text/plain;charset=utf-8",html:"text/html;charset=utf-8",pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",zip:"application/zip"};
  const downloads={save:async({filename,data})=>{
    if(!filename||data==null||data==="")throw {code:"bad_request",message:"fichier vide"};
    const ext=String(filename).split(".").pop().toLowerCase();
    const blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||"application/octet-stream"});
    const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=String(filename).replace(/[\\/:*?"<>|]+/g,"_");document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
    return {status:"saved"};
  }};

  /* ---------- Fichiers (stockage privé Supabase) ---------- */
  const assets={
    async upload(file,opts){
      const bucket=opts&&opts.type?"fichiers":"scans",safe=String(file.name||"fichier").replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80),path=newId()+"-"+safe;
      const ct=file.type||(opts&&opts.type)||"application/octet-stream";
      const {error}=await sb.storage.from(bucket).upload(path,file,{contentType:ct,upsert:false});
      if(error)throw mkErr(error);
      return {id:bucket+"/"+path,sizeBytes:file.size,contentType:ct};
    },
    async delete(id){const i=String(id).indexOf("/"),{error}=await sb.storage.from(String(id).slice(0,i)).remove([String(id).slice(i+1)]);if(error)throw mkErr(error)},
    async blob(id){const i=String(id).indexOf("/"),{data,error}=await sb.storage.from(String(id).slice(0,i)).download(String(id).slice(i+1));if(error)throw mkErr(error);return data}
  };

  /* ---------- Démarrage ---------- */
  async function loadMe(session){
    const u=session.user,{data,error}=await sb.from("members").select("role,nom,prenom,actif").eq("user_id",u.id).maybeSingle();
    if(error)throw error;
    if(!data||data.actif===false)return null;
    ME={id:u.id,email:u.email||"",role:data.role,nom:data.nom||"",prenom:data.prenom||""};
    ME.name=dispName({prenom:ME.prenom,nom:ME.nom,email:ME.email});
    return ME;
  }
  async function logConnexion(){
    try{
      if(sessionStorage.getItem("arch_conn")==="1")return;
      const r=DB.doc("connexions/"+ME.id),s=await r.get(),o=s.exists?s.data():{};
      await r.set({nom:ME.nom||ME.email,prenom:ME.prenom||"",compte:ME.email,premiere:o.premiere||new Date().toISOString(),t:new Date().toISOString(),n:(+o.n||0)+1});
      sessionStorage.setItem("arch_conn","1");
    }catch(e){}
  }
  function addLogout(){
    const h=document.querySelector(".hd");if(!h||$$("#sbout"))return;
    const b=document.createElement("button");b.id="sbout";b.className="thm out";b.type="button";b.innerHTML=(typeof navIco==="function"?navIco("out"):"")+'<span class="tl">Déconnexion</span>';b.title="Se déconnecter ("+ME.email+")";b.setAttribute("aria-label","Se déconnecter");
    b.onclick=async()=>{await sb.auth.signOut();if(window.localWipe)try{await window.localWipe()}catch(e){}location.reload()};h.appendChild(b);
  }
  function idleGuard(){
    let last=Date.now(),bar=null,dead=false,wr=0;
    const stored=()=>{try{return +localStorage.getItem(IDLE_KEY)||0}catch(e){return 0}};
    const save=()=>{try{localStorage.setItem(IDLE_KEY,String(last))}catch(e){}};
    const act=()=>{if(Date.now()-Math.max(last,stored())>=IDLE_MS)return out();last=Date.now();if(bar){bar.remove();bar=null}if(last-wr>5000){wr=last;save()}};
    save();
    ["click","keydown","touchstart","touchmove","touchend","pointerdown","mousedown","scroll","wheel","mousemove"].forEach(ev=>document.addEventListener(ev,act,{passive:true,capture:true}));
    const out=async()=>{if(dead)return;dead=true;try{await sb.auth.signOut({scope:"local"})}catch(e){}try{localStorage.removeItem(IDLE_KEY)}catch(e){}if(window.localWipe)try{await window.localWipe()}catch(e){}location.reload()};
    const tick=()=>{
      const idle=Date.now()-Math.max(last,stored());
      if(idle>=IDLE_MS)return out();
      if(idle>=IDLE_MS-WARN_MS){
        const s=Math.ceil((IDLE_MS-idle)/1000);
        if(!bar){bar=document.createElement("div");bar.setAttribute("role","alert");bar.setAttribute("style","position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:99999;background:#7a1f1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);font:14px system-ui,sans-serif;max-width:92vw;text-align:center");document.body.appendChild(bar)}
        bar.textContent="Inactivité : déconnexion dans "+s+" s. Bougez la souris ou touchez l’écran pour rester connecté.";
      }
    };
    setInterval(tick,1000);["visibilitychange","focus","pageshow","resume"].forEach(ev=>(ev==="visibilitychange"?document:window).addEventListener(ev,tick));
  }
  function identityView(){
    return new Promise(res=>{
      const o=overlay(`<p style="margin:0 0 6px">Bienvenue. Pour que vos actions (demandes, dépôts dans la GED, journal) portent votre nom, indiquez votre nom et votre prénom. Cette étape n'est demandée qu'une fois.</p><label for="sb_inom">Nom</label><input id="sb_inom" maxlength="40" autocomplete="family-name"><label for="sb_ipre">Prénom</label><input id="sb_ipre" maxlength="40" autocomplete="given-name"><div id="sb_msg" class="mu" style="color:var(--er,#b3261e);min-height:20px;margin:8px 0"></div><div class="acts"><button class="pri" id="sb_iok">Enregistrer et continuer</button></div>`);
      const m=o.querySelector("#sb_msg"),b=o.querySelector("#sb_iok");
      const go=async()=>{
        const n=o.querySelector("#sb_inom").value.trim(),p=o.querySelector("#sb_ipre").value.trim();
        if(n.length<2||p.length<2){m.textContent="Indiquez votre nom et votre prénom (2 caractères minimum).";return}
        if(/[<>"&]/.test(n+p)){m.textContent="Évitez les caractères < > \" &.";return}
        b.disabled=true;m.style.color="var(--mu,#5f6580)";m.textContent="Enregistrement…";
        const {error}=await sb.rpc("maj_mon_identite",{p_nom:n,p_prenom:p});
        if(error&&!/déjà renseignée/.test(error.message||"")){b.disabled=false;m.style.color="var(--er,#b3261e)";m.textContent="Enregistrement impossible : "+(error.message||error);return}
        if(!error){ME.nom=n;ME.prenom=p;ME.name=dispName({prenom:p,nom:n,email:ME.email})}
        res();
      };
      b.onclick=go;o.querySelector("#sb_ipre").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
      setTimeout(()=>o.querySelector("#sb_inom").focus(),50);
    });
  }
  async function boot(){
    if(!window.supabase||!CFG.url||!CFG.key){overlay('<p>Impossible de charger le service de connexion. Vérifiez votre accès internet puis actualisez la page.</p>');readyRes(null);return}
    sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,experimental:{passkey:true}}});
    window.GEDSB=()=>sb;window.SBME=()=>ME;
    sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")newPwdView();if(ev==="SIGNED_OUT"&&ME)location.reload()});
    let {data:{session}}=await sb.auth.getSession();
    if(location.hash.includes("type=recovery")){return}   // l'écran de nouveau mot de passe est géré par l'évènement ci-dessus
    if(session){let t=0;try{t=+localStorage.getItem(IDLE_KEY)||0}catch(e){}
      if(!t||Date.now()-t>=IDLE_MS){try{await sb.auth.signOut({scope:"local"})}catch(e){}try{localStorage.removeItem(IDLE_KEY)}catch(e){}if(window.localWipe)try{await window.localWipe()}catch(e){}session=null}}
    if(!session){await loginView();({data:{session}}=await sb.auth.getSession())}
    try{
      if(!(await loadMe(session))){blockedView("Votre compte existe mais n'a pas encore de rôle ou a été désactivé. Contactez l'administrateur.");readyRes(null);return}
    }catch(e){blockedView("Impossible de vérifier votre compte : "+(e&&e.message||e));readyRes(null);return}
    if(!ME.nom||!ME.prenom){try{await identityView()}catch(e){}}
    DB=makeDB();hideOverlay();addLogout();idleGuard();readyRes(true);logConnexion();
  }
  window.PLATFORM={
    db:async()=>(await readyP)?DB:null,
    user:async()=>(await readyP)?makeUser():null,
    downloads:async()=>downloads,
    assets:async()=>(await readyP)?assets:null,
    sample:async()=>null
  };
  const start=()=>boot().catch(e=>{overlay("<p>Erreur au démarrage : "+esc(e&&e.message||e)+"</p>");readyRes(null)});
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();

<script>
/* Couche plateforme : un seul point d'entrée vers la base, les utilisateurs, les téléchargements, les fichiers et l'IA.
   Sur Claude : services de la plateforme. Ailleurs (Supabase) : window.PLATFORM = {db,user,downloads,assets,sample} fournis par un module de connexion. */
const PF={use:async k=>{try{if(window.claude&&window.claude.use)return await window.claude.use(k);const f=(window.PLATFORM||{})[k];return f?await f():null}catch(e){return null}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=new Intl.Collator("fr"),cmp=(a,b)=>COL.compare(String(a),String(b)),OCOL=new Intl.Collator("fr",{ignorePunctuation:true}),ocmp=(a,b)=>OCOL.compare(String(a),String(b));
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const nextNum=(p,a)=>{const y=new Date().getFullYear(),re=new RegExp("^"+p+"-"+y+"-(\\d+)$");return p+"-"+y+"-"+String(Math.max(0,...a.map(x=>{const m=re.exec(x.num||"");return m?+m[1]:0}))+1).padStart(3,"0")};
async function freeNum(c,p,a){let n=nextNum(p,a);for(let i=0;i<50;i++){const s=await db.doc(c+"/"+hid(n)).get();if(!s||!s.exists)return n;n=n.replace(/\d+$/,k=>String(+k+1).padStart(3,"0"))}return n}
const fmt=d=>d?esc(String(d).split("-").reverse().join("/")):"–";
const TYPES=["Chrono","Carton","Chemise","Volume relié"],MODES=["Consultation sur place","Prêt interne","Remise au service"];
const APP_VER="11 nov. 2026 – E-mails 3.3";
let db=null,docs=[],prets=[],membres=[],destr=[],demandes=[],lots=[],versements=[],controles=[],user=null,P={id:null,name:"",email:"",owner:false,admin:false,write:true},tab="dash",f={q:"",dir:"",an:"",typ:"",s:"",st:""};
let lim=100,ready=false;

const NUM=v=>Number.isFinite(+v)?+v:0,ID=v=>String(v??"").replace(/[<>"'&`\\\s]/g,"");
const fixDoc=o=>{o.annee=NUM(o.annee);o.nb=NUM(o.nb);if(o.moves)o.moves=Array.isArray(o.moves)?o.moves.slice(-50).map(m=>({t:String(m&&m.t||'').slice(0,25),de:String(m&&m.de||'').slice(0,120),vers:String(m&&m.vers||'').slice(0,120),nom:String(m&&m.nom||'').slice(0,80)})):[];return o};
const fixPret=o=>{o.par=ID(o.par);o.valideUid=ID(o.valideUid);return o};
const fixDem=o=>{o.par=ID(o.par);o.valPar=ID(o.valPar);return o};
const fixDestr=o=>{o.par=ID(o.par);const a={};for(const k in (o.ap||{}))a[k]=ID(o.ap[k]);o.ap=a;o.items=(o.items||[]).map(i=>({...i,nb:NUM(i.nb),fin:NUM(i.fin)}));return o};
const fixCtl=o=>{o.items=(o.items||[]).map(i=>[ID(i[0]),i[1],i[2]]);const r={};for(const k in (o.res||{})){if(CS[o.res[k]])r[k]=o.res[k]}o.res=r;return o};
const fixVers=o=>{o.lignes=(o.lignes||[]).map(l=>[l[0],NUM(l[1]),l[2]]);return o};
let journal=[];
async function jr(act,label){try{await db.collection("journal").doc().set({t:new Date().toISOString(),par:P.id||"",nom:P.name||"",act,label:String(label||"").slice(0,200)})}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.toggle("err",/erreur|impossible|non autoris|obligatoire|invalide|refus|indiquez|introuvable|déjà|ne peut/i.test(String(t)));e.style.display="block";e.classList.remove("in");void e.offsetWidth;e.classList.add("in");clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4000)}
function fail(e){toast(e&&e.code==="not_granted"?"Modification non autorisée : demandez le droit de contributeur au propriétaire.":"Erreur : "+(e&&e.message||e))}

const ADM=c=>(window.PLATFORM_SB||P.admin||P.owner)?db.collection(c):{onSnapshot(){}};

db.collection('directions').onSnapshot(s=>{refDir=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='team')render()},fail);db.collection('services').onSnapshot(s=>{refSrv=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='team')render()},fail);
ADM("copies").onSnapshot(s=>{copies=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="pret"||tab==="dash")render()},fail);ADM("journal").onSnapshot(s=>{journal=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="team")render()},fail);ADM("membres").onSnapshot(s=>{membres=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  ADM("destructions").onSnapshot(s=>{destr=s.docs.map(d=>fixDestr({id:d.id,...d.data()}));render()},fail);

function late(p){return p.statut==="en_cours"&&p.prevu&&p.prevu<today()}
function stats(){
  const units=docs.reduce((n,d)=>n+(+d.nb||0),0),open=prets.filter(p=>p.statut==="en_cours");
  return{units,open,late:open.filter(late)};
}

function salut(){
  if(!P.name&&!P.email)return "";const h=new Date().getHours(),g=(h>=6&&h<15)?"Bonjour":"Bonsoir",nm=P.name&&P.name!==P.email?P.name:"";
  return `<p style="margin:2px 0 10px;font-size:17px">${g}${nm?` <b>${esc(nm)}</b>`:""}${P.email?` <span class="mu" style="font-size:13px">(${esc(P.email)})</span>`:""}</p>`;
}
function qui(s){
  if(!s.open.length)return "";
  const g=new Map();s.open.forEach(p=>{const k=(p.demandeur||"–")+"|"+(p.service||"");const o=g.get(k)||{n:p.demandeur||"–",sv:p.service||"",c:0,d:"",late:0};o.c++;if(!o.d||(p.sortie||"")<o.d)o.d=p.sortie||"";if(late(p))o.late++;g.set(k,o)});
  const L=[...g.values()].sort((a,b)=>b.c-a.c);
  return `<div class="card"><b>Documents actuellement en sortie</b><div class="mu">${s.open.length} document(s) chez ${L.length} personne(s)</div>${L.slice(0,8).map(o=>`<div class="row" style="justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--bd)"><span>${esc(o.n)}${o.sv?` <span class="mu">(${esc(o.sv)})</span>`:""}</span><span class="${o.late?"b er":"mu"}">${o.c} doc.${o.d?" · depuis "+fmt(o.d):""}${o.late?" · "+o.late+" en retard":""}</span></div>`).join("")}${L.length>8?`<div class="mu">… et ${L.length-8} autre(s)</div>`:""}<div class="acts"><button class="sm pri" data-a="pvgo">Voir les sorties</button></div></div>`;
}
function yearChart(){
  const by={};docs.forEach(d=>{if(d.statut!=="detruit"&&d.annee)by[d.annee]=(by[d.annee]||0)+1});
  const ys=Object.keys(by).map(Number).sort((a,b)=>a-b);if(ys.length<2)return "";
  let a=ys[0];const z=ys[ys.length-1];if(z-a>24)a=z-24;const L=[];for(let y=a;y<=z;y++)L.push([y,by[y]||0]);
  const mx=Math.max(1,...L.map(x=>x[1])),step=L.length>16?5:L.length>8?2:1,top=L.reduce((m,x)=>x[1]>m[1]?x:m,L[0]),old=ys.filter(y=>y<a).reduce((n,y)=>n+by[y],0);
  return `<h2>Entrées par année</h2><div class="card ych"><div class="mu" style="margin-bottom:8px">Nombre d’entrées d’inventaire selon l’année du document${old?` (${old} entrée(s) antérieure(s) à ${a} non affichée(s))`:""}. Touchez une année pour voir ses documents.</div><div class="ycw" role="list">${L.map(([y,n])=>`<button class="ycb${y===top[0]?" ymx":""}" data-a="yr" data-v="${esc(y)}" role="listitem" aria-label="${y} : ${n} entrée(s)" data-t="${y} · ${n} entrée${n>1?"s":""}"><span class="ycv">${y===top[0]?n:""}</span><span class="ycp"><i style="height:${n?Math.max(2,n/mx*100):0}%"></i></span><span class="ycl">${(y-a)%step===0||y===z?(L.length>12?"’"+String(y).slice(2):y):""}</span></button>`).join("")}</div></div>`;
}
function dash(){

  const max=Math.max(1,...Object.values(by));
  return `${salut()}<div class="row"><input id="qs" type="search" enterkeyhint="search" placeholder="Rechercher un document (puis Entrée)…"></div>

  ${!ready?'<p class="mu">Chargement des données…</p>':""}${ready&&!docs.length?'<div class="card"><b>Pour démarrer</b><div class="mu">1. « + Nouvelle entrée » pour saisir un premier document, ou « Importer » (onglet Inventaire) pour charger un fichier Excel.<br>2. Classez chaque entrée dans une catégorie de conservation.<br>3. « Sortie directe » enregistre un prêt ou une consultation.</div></div>':""}<div class="kpis">
  <div class="kpi"><b>${docs.length}</b><span class="mu">Entrées d’inventaire</span></div>

  <button class="kpi" data-a="pvgo"><b>${s.open.length}</b><span class="mu">Sorties en cours</span></button>
  <button class="kpi" data-a="pvgo"><b style="color:${s.late.length?"var(--er)":"inherit"}">${s.late.length}</b><span class="mu">En retard</span></button></div>

  +(s.late.length?`<h2 style="margin-top:16px">Retours en retard</h2>`+s.late.map(pretCard).join(""):"")+topStats()+`<p class="mu" style="font-size:11px;text-align:center;margin-top:18px">Archives NITA · version ${APP_VER}</p>`;
}

const SK=new WeakMap();
const skey=d=>{let k=SK.get(d);if(k===undefined){k=" "+norm([d.intitule,d.cote,d.mots,d.direction,d.service,d.empl,d.obs,d.annee,d.mois].join(" "))+" ";SK.set(d,k)}return k};
/* Recherche par mots : sans accents ni majuscules, espaces en trop ignorés, ordre des mots libre, « salaires » trouve aussi « salaire » */
const sword=w=>w.length>3&&w.endsWith("s")?w.slice(0,-1):w;
function filtered(){
  const ws=norm(f.q).split(" ").filter(Boolean).map(sword);
  return docs.filter(d=>(!f.dir||d.direction===f.dir)&&(!f.srv||d.service===f.srv)&&(!f.an||String(d.annee)===f.an)&&(!f.typ||d.type===f.typ)&&(!f.st||(f.st==="sortie"?d.statut==="en_pret":f.st==="detruit"?d.statut==="detruit":d.statut!=="en_pret"&&d.statut!=="detruit"))&&(!ws.length||ws.every(w=>skey(d).includes(w))));
}
function listHTML(){
  const SORTS={cote:(x,y)=>cmp(x.cote||"",y.cote||""),recent:(x,y)=>y.annee-x.annee||cmp(x.intitule,y.intitule),titre:(x,y)=>cmp(x.intitule,y.intitule)},flat=!!SORTS[f.s];
  const a=filtered().sort(flat?SORTS[f.s]:(x,y)=>ocmp(x.direction,y.direction)||ocmp(x.service,y.service)||x.annee-y.annee||tcmp(x,y));
  if(!a.length)return !ready?'<p class="mu">Chargement des données…</p>':docs.length?'<p class="mu">Aucun document ne correspond à la recherche.</p>':'<p class="mu">L’inventaire est vide. Touchez « + Ajouter » pour saisir une première entrée, ou « Importer » pour charger un fichier Excel.</p>';

  for(const d of a.slice(0,lim)){
    if(!flat&&d.direction!==k1){h+=`<h3>${esc(d.direction)}</h3>`;k1=d.direction;k2="";k3=""}
    if(!flat&&d.service!==k2){h+=`<h4>${esc(d.service)}</h4>`;k2=d.service;k3=""}
    const k4=d.annee+"|"+(MOISN.includes(String(d.mois||"").toLowerCase())?String(d.mois).toLowerCase():"");if(!flat&&k4!==k3){h+=`<h5>${esc(d.annee)}${k4.split("|")[1]?" · "+esc(k4.split("|")[1]):""}</h5>`;k3=k4}
    const out=d.statut==="en_pret",pr=out?actPret[d.id]:null;
    h+=`<div class="card"><div class="top"><b>${esc(d.intitule)}</b><span class="b ${d.statut==="detruit"?"er":out?"wa":"ok"}">${d.statut==="detruit"?"Détruit":out?"En sortie":"Disponible"}</span></div>
    <div class="mu">${flat?`<span class="b">${esc(d.direction)} › ${esc(d.service)} · ${esc(d.annee)}</span> `:""}<span class="b">${esc(d.type)}</span>${d.mois?esc(d.mois)+" · ":""}${esc(d.nb)} unité(s) ${cb(d)}${d.cote?" · cote "+esc(d.cote):""}${d.empl?" · "+esc(d.empl):""}</div>
    ${pr?`<div class="mu" style="color:var(--wa)"><b>Emprunté par ${esc(pr.demandeur||"–")}</b>${pr.service?" ("+esc(pr.service)+")":""}${pr.ref?" · "+esc(pr.ref):""}${pr.sortie?" · sorti le "+fmt(pr.sortie):""}</div>`:""}
    ${d.mots?`<div class="mu">Mots-clés : ${esc(d.mots)}</div>`:""}${d.obs?`<div class="mu">${esc(d.obs)}</div>`:""}

async function orgTransferGo(dir,svc){

  $("#dlg").close();
  const exist=orgSrvs(dest).find(x=>norm(x)===norm(svc)),n=exist||svc;
  const aff=docs.filter(d=>d.direction===dir&&d.service===svc),vs=versements.filter(v=>v.direction===dir&&v.service===svc);
  const msg="Transférer « "+svc+" » de « "+dir+" » vers « "+dest+" » ?"+(exist?"\nCe service existe déjà dans la direction de destination : les deux seront fusionnés.":"")+"\n"+aff.length+" entrée(s) d’inventaire et "+vs.length+" versement(s) seront déplacés.";
  if(!(await ask(msg,"Transférer")))return;
  const ops=[],U=(q,o)=>ops.push(["u",q,o]),D=q=>ops.push(["d",q]);
  aff.forEach(d=>U("docs/"+d.id,{direction:dest,service:n}));
  vs.forEach(v=>U("versements/"+v.id,{direction:dest,service:n}));
  const ro=refSrv.find(x=>x.direction===dir&&x.nom===svc),rn=refSrv.find(x=>x.direction===dest&&norm(x.nom)===norm(svc));
  if(ro&&rn)D("services/"+ro.id);else if(ro)U("services/"+ro.id,{direction:dest,nom:n});else if(!rn)ops.push(["s","services",{nom:n,direction:dest,t:new Date().toISOString(),par:P.id||""}]);
  try{
    for(let i=0;i<ops.length;i+=20){
      await Promise.all(ops.slice(i,i+20).map(([k,q,o])=>k==="u"?db.doc(q).update(o):k==="d"?db.doc(q).delete():db.collection(q).doc().set(o)));

    }

    toast("Service transféré vers « "+dest+" » : "+aff.length+" entrée(s) déplacée(s).");
  }catch(e){fail(e)}
}

async function orgRename(dir,svc){
  const isS=!!svc,old=isS?svc:dir;
  let n=((await askText("Nouveau nom pour « "+old+" » ?",old))||"").trim().slice(0,80);if(!n||n===old)return;
  const same=norm(n)===norm(old),exists=!same&&(isS?orgSrvs(dir):orgDirs()).some(x=>norm(x)===norm(n));
  if(exists)n=(isS?orgSrvs(dir):orgDirs()).find(x=>norm(x)===norm(n));
  const aff=isS?docs.filter(d=>d.direction===dir&&d.service===old):docs.filter(d=>d.direction===old);
  const msg=(exists?"« "+n+" » existe déjà : fusionner « "+old+" » dedans ?":"Renommer « "+old+" » en « "+n+" » ?")+"\n"+aff.length+" entrée(s) seront mises à jour. Les cotes déjà attribuées ne changent pas.";
  if(!(await ask(msg,exists?"Fusionner":"Renommer")))return;
  const ops=[],U=(p,o)=>ops.push(["u",p,o]),D=p=>ops.push(["d",p]),nd=norm(n);
  if(isS){
    aff.forEach(d=>U("docs/"+d.id,{service:n}));
    versements.filter(v=>v.direction===dir&&v.service===old).forEach(v=>U("versements/"+v.id,{service:n}));
    destr.filter(x=>x.direction===dir&&(x.srv||[]).includes(old)).forEach(x=>U("destructions/"+x.id,{srv:[...new Set(x.srv.map(s=>s===old?n:s))]}));
    const ro=refSrv.find(x=>x.direction===dir&&x.nom===old),rn=refSrv.find(x=>x.direction===dir&&norm(x.nom)===nd&&x!==ro);
    if(ro&&rn)D("services/"+ro.id);else if(ro)U("services/"+ro.id,{nom:n});else if(!rn)ops.push(["s","services",{nom:n,direction:dir,t:new Date().toISOString(),par:P.id||""}]);
  }else{
    aff.forEach(d=>U("docs/"+d.id,{direction:n}));
    versements.filter(v=>v.direction===old).forEach(v=>U("versements/"+v.id,{direction:n}));
    destr.filter(x=>x.direction===old).forEach(x=>U("destructions/"+x.id,{direction:n}));
    refSrv.filter(x=>x.direction===old).forEach(x=>{if(refSrv.some(y=>y.direction!==old&&norm(y.direction)===nd&&norm(y.nom)===norm(x.nom)))D("services/"+x.id);else U("services/"+x.id,{direction:n})});
    const ro=refDir.find(x=>x.nom===old),rn=refDir.find(x=>norm(x.nom)===nd&&x!==ro);
    if(ro&&rn)D("directions/"+ro.id);else if(ro)U("directions/"+ro.id,{nom:n});else if(!rn)ops.push(["s","directions",{nom:n,t:new Date().toISOString(),par:P.id||""}]);
  }
  try{
    for(let i=0;i<ops.length;i+=10){
      await Promise.all(ops.slice(i,i+10).map(([k,p,o])=>k==="u"?db.doc(p).update(o):k==="d"?db.doc(p).delete():db.collection(p).doc().set(o)));
      const m=$("#omsg");if(m)m.textContent="Mise à jour : "+Math.min(i+10,ops.length)+" / "+ops.length;
    }
    jr(isS?"Service renommé":"Direction renommée",(isS?dir+" › ":"")+old+" → "+n+" · "+aff.length+" entrée(s)"+(exists?" (fusion)":""));
    toast((exists?"Fusion terminée : ":"Renommage terminé : ")+aff.length+" entrée(s) mise(s) à jour.");
  }catch(e){fail(e)}
}

function chkData(){
  const act=docs.filter(d=>d.statut!=="detruit"),g={};
  act.forEach(d=>{const k=[d.service,d.annee,d.mois||"",String(d.intitule||"").trim().toLowerCase()].join("|");(g[k]=g[k]||[]).push(d)});
  const dbl=Object.values(g).filter(a=>a.length>1&&!/sans nom|non renseign/i.test(a[0].intitule||""));
  return{empl:act.filter(d=>!String(d.empl||"").trim()),dbl,np:prets.filter(p=>p.statut==="en_cours"&&!p.prevu)};
}
function chkList(k){

<script>
/* ---- Recherche rapide (Ctrl+K) : onglets, actions, inventaire et GED ---- */
(function(){
  const dlg=document.createElement("dialog");dlg.id="cmdk";dlg.className="cmdk";dlg.setAttribute("aria-label","Recherche rapide");
  dlg.innerHTML='<div class="cmdh"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="cmdq" type="text" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="Rechercher un document, un fichier de la GED, un onglet…" aria-label="Rechercher"><button type="button" class="cmdx" id="cmdx" aria-label="Fermer">Échap</button></div><div id="cmdr" class="cmdr" role="listbox"></div><div class="cmdf"><span>↑ ↓ choisir</span><span>Entrée ouvrir</span><span>Échap fermer</span></div>';
  document.body.appendChild(dlg);
  let items=[],sel=0,idx=null,idxOf=null;
  const q=()=>document.getElementById("cmdq");
  const mk=(grp,ico,t,sub,run)=>({grp,ico,t,sub,run});
  function docIdx(){if(idxOf===docs)return idx;idxOf=docs;idx=docs.map(d=>[norm([d.intitule,d.cote,d.service,d.direction,d.annee,d.mois,d.empl,d.mots,d.type].join(" ")),d]);return idx}
  function gedFiles(){if(typeof G==="undefined")return[];const m=new Map();Object.values(G.cache||{}).forEach(c=>(c.F||[]).forEach(f=>m.set(f.id,f)));(G.RC||[]).forEach(f=>m.set(f.id,f));return [...m.values()].filter(f=>f.courant&&f.statut!=="corbeille")}
  const gi=(x,sv)=>Object.assign(mk("GED","ged",x.nom,[sv.nom,typeof gsz==="function"?gsz(x.taille):""].filter(Boolean).join(" · "),async()=>{if(tab!=="ged")goTab("ged");try{await gedAct("open",x.id)}catch(e){toast("Ouverture impossible : "+(e.message||e))}}),{id:x.id});
  let srvT=null;
  function srvSearch(s){clearTimeout(srvT);if(!window.PLATFORM_SB||typeof gSearchAll!=="function"||norm(s).length<2)return;
    srvT=setTimeout(async()=>{let r=[];try{r=await gSearchAll(s)}catch(e){return}if(!dlg.open||q().value!==s)return;
      const have=new Set(items.filter(x=>x.id).map(x=>x.id)),add=r.filter(x=>!have.has(x.id)).slice(0,10).map(x=>gi(x,gsrv(x.service_id)));if(!add.length)return;
      const fb=items.findIndex(x=>x.grp==="GED"&&!x.id);if(fb>=0)items.splice(fb,1);
      let at=items.length;for(let i=items.length-1;i>=0;i--){if(items[i].grp==="GED"){at=i+1;break}}items.splice(at,0,...add);paint()},250)}
  function goTab(v){const b=document.querySelector('nav button[data-v="'+v+'"]');if(b)b.click()}
  function build(){
    const s=q().value,ws=norm(s).split(" ").filter(Boolean),out=[],hit=k=>ws.every(w=>k.includes(w));
    const navs=[...document.querySelectorAll("nav button")].filter(b=>getComputedStyle(b).display!=="none").map(b=>mk("Aller à",b.dataset.v||b.dataset.i||"aide",b.dataset.l||b.textContent,"",()=>b.click()));
    const fab=document.getElementById("fab"),acts=[];
    if(fab&&getComputedStyle(fab).display!=="none")acts.push(mk("Actions","inv","Nouvelle entrée dans l’inventaire","Ajouter un document",()=>fab.click()));
    acts.push(mk("Actions",(document.documentElement.dataset.theme||"auto"),"Changer de thème","Automatique, clair ou sombre",()=>{thmNext();build()}));
    if(!ws.length){out.push(...navs,...acts)}
    else{
      out.push(...[...navs,...acts].filter(x=>hit(norm(x.t+" "+x.sub))));
      const ds=[];for(const [k,d] of docIdx()){if(d.statut==="detruit")continue;if(hit(k)){ds.push(d);if(ds.length>=8)break}}
      ds.forEach(d=>out.push(mk("Inventaire","inv",d.intitule||"(sans intitulé)",[d.service,d.annee,d.mois,d.empl,d.cote,d.statut==="en_pret"?"en sortie":""].filter(Boolean).join(" · "),()=>{Object.assign(f,{q:d.intitule||"",dir:"",an:"",typ:"",s:"",st:""});if("srv" in f)f.srv="";lim=100;if(tab==="inv")render();else goTab("inv");setTimeout(()=>{const i=document.getElementById("q");if(i)i.value=f.q},60)})));
      const gs=gedFiles().filter(x=>hit(norm([x.nom,x.description,x.cat,x.annee,x.cree_nom].join(" ")))).slice(0,8);
      gs.forEach(x=>{const sv=(typeof gsrv==="function"?gsrv(x.service_id):{nom:""});out.push(gi(x,sv,))});
      if(typeof G!=="undefined"&&window.PLATFORM_SB&&!gs.length)out.push(mk("GED","ged","Chercher « "+s+" » dans la GED","Ouvre la GED avec cette recherche",()=>{goTab("ged");setTimeout(()=>{const i=document.getElementById("gq");if(i){i.value=s;i.dispatchEvent(new Event("input",{bubbles:true}))}},400)}));
    }
    items=out;sel=0;paint();if(ws.length)srvSearch(s);
  }
  function paint(){
    const r=document.getElementById("cmdr");let g="",h="";
    if(!items.length){r.innerHTML='<div class="cmde">Aucun résultat. Essayez un autre mot (intitulé, cote, service, année…).</div>';return}
    items.forEach((x,i)=>{if(x.grp!==g){g=x.grp;h+='<div class="cmdg">'+esc(g)+'</div>'}h+='<button type="button" class="cmdi'+(i===sel?" on":"")+'" data-ci="'+i+'" role="option" aria-selected="'+(i===sel)+'">'+navIco(x.ico)+'<span class="cmdt"><b>'+esc(x.t)+'</b>'+(x.sub?'<small>'+esc(x.sub)+'</small>':"")+'</span></button>'});
    r.innerHTML=h;const o=r.querySelector(".cmdi.on");if(o)o.scrollIntoView({block:"nearest"});
  }
  function run(i){const x=items[i];if(!x)return;dlg.close();setTimeout(()=>x.run(),10)}
  window.cmdOpen=()=>{if(dlg.open)return;const d=document.getElementById("dlg");if(d&&d.open)d.close();q().value="";build();dlg.showModal();setTimeout(()=>q().focus(),20)};

  dlg.addEventListener("click",e=>{const b=e.target.closest(".cmdi");if(b)return run(+b.dataset.ci);if(e.target.id==="cmdx"||e.target===dlg)dlg.close()});
  document.addEventListener("keydown",e=>{const t=e.target,typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);

})();

  function force(pw,me){const p=String(pw);let c=0;if(/[a-z]/.test(p))c++;if(/[A-Z]/.test(p))c++;if(/[0-9]/.test(p))c++;if(/[^A-Za-z0-9]/.test(p))c++;

  setTimeout(()=>{if(box.classList.contains("on"))return;
    if(inApp){const nav=ios?"Safari":"Chrome";show(`<b>Ouvrez ce lien dans ${nav}</b><span>Ce navigateur intégré ne permet pas d’installer l’application. Touchez le menu (⋮ ou •••), puis « Ouvrir dans ${nav} » (ou « Ouvrir dans le navigateur »).</span>`,'<button type="button" class="pri" id="inst_cp">Copier le lien</button>');
      const c=box.querySelector("#inst_cp");c.onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+"/");c.textContent="Lien copié"}catch(e){c.textContent=location.host}};return}
    if(ios)show(`<b>Installer Archives NITA sur l’iPhone</b><span>Touchez <span class="ish">${SH}</span> <b>Partager</b> (en bas de l’écran, ou dans « ••• »), puis <b>« Sur l’écran d’accueil »</b> et <b>Ajouter</b>.</span>`);
  },android||ios?2500:1500);
})();
</script>
<script>
/* ---- Navigation dans les longues pages : sommaire des sections ---- */
(function(){
  const app=document.getElementById("app");if(!app||!window.MutationObserver)return;
  const TABS={team:1,cons:1,pret:1,rap:1};let busy=false;
  const clean=t=>String(t).replace(/\s*\(\d+[^)]*\)\s*$/,"").trim();
  function build(){if(busy)return;busy=true;try{
    const old=app.querySelector(":scope > .secnav");
    if(!TABS[typeof tab!=="undefined"?tab:""]){if(old)old.remove();return}
    const hs=[...app.querySelectorAll(":scope > h2, :scope > div > h2, :scope > section > h2")].filter(h=>h.offsetParent!==null);
    if(hs.length<4){if(old)old.remove();return}
    const sig=hs.map(h=>clean(h.textContent)).join("|");if(old&&old.dataset.sig===sig)return;
    const n=document.createElement("div");n.className="secnav";n.dataset.sig=sig;n.setAttribute("role","navigation");n.setAttribute("aria-label","Sections de la page");
    hs.forEach((h,i)=>{if(!h.id)h.id="sec_"+i;const b=document.createElement("button");b.type="button";b.textContent=clean(h.textContent);b.onclick=()=>{const y=h.getBoundingClientRect().top+scrollY-(innerWidth<1024?70:16);scrollTo({top:y,behavior:"smooth"})};n.appendChild(b)});
    if(old)old.replaceWith(n);else app.prepend(n);
  }finally{busy=false}}
  let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(build,60)}).observe(app,{childList:true,subtree:false});
  setTimeout(build,800);
})();
/* ---- Inventaire : toucher une carte ouvre sa fiche ---- */
document.addEventListener("click",e=>{const c=e.target.closest&&e.target.closest("#lst .card");if(!c||e.target.closest("button,a,input,select,textarea,label"))return;if(getSelection&&String(getSelection()).length)return;const f=c.querySelector('button[data-a="fiche"]');if(f)f.click()});
</script></body></html>
