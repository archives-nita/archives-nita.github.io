.gvoile{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--cd,#fff);color:var(--tx);border-radius:10px;font-weight:600}

#plst .card,#lst .card{content-visibility:auto;contain-intrinsic-size:auto 160px}

.rcsug{margin:4px 0 6px}.rcs{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:10px;margin:4px 0}.rcs>div{min-width:0}.rcs button{flex:none;width:auto}.rch{font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.04em}

  /* ---------- Base de données (même interface que la plateforme Claude) ---------- */
  const regs={};                                   // collection -> ensemble d'écouteurs (pour les écritures locales)
  const applyLocal=(c,id,data)=>{(regs[c]||[]).forEach(r=>r.apply(id,data))};
  const localOf=(c,id)=>{for(const r of (regs[c]||[])){const v=r.get&&r.get(id);if(v!==undefined)return JSON.parse(JSON.stringify(v))}return undefined};
  function docsCollection(c){
    const ref=id=>docRef(c,id||newId());
    return {
      doc:ref,
      get:async()=>{const rows=await fetchAll(c);return {docs:rows.map(r=>({id:r.id,data:()=>r.data}))}},
      onSnapshot(cb,errcb){
        const cache=new Map();let timer=0,dead=false,ch=null;
        const emit=()=>{if(dead||timer)return;timer=setTimeout(()=>{timer=0;if(!dead)cb({docs:[...cache.entries()].map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))}))})},30)};
        const reg={get(id){return cache.get(id)},apply(id,data){if(data===null)cache.delete(id);else cache.set(id,data);emit()},merge(id,patch){if(!cache.has(id))return false;cache.set(id,{...cache.get(id),...patch});emit();return true}};
        (regs[c]=regs[c]||new Set()).add(reg);
        // repère serveur : date de la dernière modification connue (sert à ne recharger que les changements)
        let mark=null;
        const top=()=>topOf(c);
        const load=async()=>{try{const pf=takePref(c);let m,rows;if(pf){try{[m,rows]=await Promise.all([pf.m.catch(()=>null),pf.p])}catch(x){rows=null}}if(!rows)[m,rows]=await Promise.all([top().catch(()=>null),fetchAll(c)]);cache.clear();rows.forEach(r=>cache.set(r.id,r.data));mark=m;emit()}catch(e){if(errcb)errcb(mkErr(e))}};   // repère et données en parallèle
        // synchronisation légère : seulement les lignes modifiées depuis le repère (marge de 30 s) + la liste des identifiants (suppressions)
        const sync=async()=>{
          if(!mark||cache.size<=300)return load();          // petite collection : un seul rechargement suffit
          try{
            const m=await top();
            const since=new Date(Date.parse(mark)-30000).toISOString();
            const [chg,ids]=await Promise.all([pages(c,"id,data",since),pages(c,"id",null)]);
            chg.forEach(r=>cache.set(r.id,r.data));
            const keep=new Set(ids.map(r=>r.id));let del=0;
            for(const k of [...cache.keys()])if(!keep.has(k)){cache.delete(k);del++}
            if(m)mark=m;window.__sync=(window.__sync||0)+1;
            if(chg.length||del)emit();
          }catch(e){load()}
        };
        load();
        if(c!=="fichiers_data"){
          try{
            ch=sb.channel("rt-"+c+"-"+newId()).on("postgres_changes",{event:"*",schema:"public",table:"documents",filter:"collection=eq."+c},p=>{
              if(p.eventType==="DELETE"){cache.delete(p.old&&p.old.id);emit()}else if(p.new&&p.new.id){cache.set(p.new.id,p.new.data);emit()}
            }).subscribe(st=>{if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")setTimeout(sync,4000)});
          }catch(e){}
        }
        let hid=0;const vis=()=>{if(document.visibilityState==="hidden"){hid=Date.now();return}if(Date.now()-hid>60000)sync()};document.addEventListener("visibilitychange",vis);
        return ()=>{dead=true;regs[c].delete(reg);document.removeEventListener("visibilitychange",vis);try{ch&&sb.removeChannel(ch)}catch(e){}};
      }
    };
  }
  // lecture paginée générique (colonnes choisies, éventuellement depuis une date)
  async function pages(c,cols,since){
    const out=[];for(let from=0;;from+=1000){
      let q=sb.from("documents").select(cols).eq("collection",c);if(since)q=q.gte("updated_at",since);
      const {data,error}=await q.order("id").range(from,from+999);
      if(error)throw error;out.push(...data);if(data.length<1000)break;
    }
    return out;
  }
  async function topOf(c){const {data,error}=await sb.from("documents").select("updated_at").eq("collection",c).order("updated_at",{ascending:false}).limit(1);if(error)throw error;return data&&data[0]?data[0].updated_at:null}
  // préchargement : l'inventaire et les prêts partent en même temps que la lecture du rôle (les droits restent appliqués par le serveur)
  const PREF={},PREF_ALL=["docs","prets","demandes","destructions","controles","versements","directions","services","copies","journal","isad","lots"];
  function prefetch(cs){cs.forEach(c=>{const p=fetchAll(c),m=topOf(c);p.catch(()=>{});m.catch(()=>{});PREF[c]={t:Date.now(),p,m}})}
  function takePref(c){const x=PREF[c];delete PREF[c];return x&&Date.now()-x.t<30000?x:null}
  async function fetchAll(c){
    const pg=from=>sb.from("documents").select("id,data").eq("collection",c).order("id").range(from,from+999);
    if(c==="docs"){
      // nombre d'entrées retenu de la dernière ouverture (un simple chiffre, pas de données) : toutes les pages partent ensemble
      let hint=0;try{hint=+localStorage.getItem("nita_nb_docs")||0}catch(e){}
      const note=n=>{try{localStorage.setItem("nita_nb_docs",String(n))}catch(e){}};
      if(hint>1000){
        const offs=[];for(let o=0;o<hint+50;o+=1000)offs.push(o);
        const pages=[];let i=0;const run=async()=>{while(i<offs.length){const k=i++,r=await pg(offs[k]);if(r.error)throw r.error;pages[k]=r.data}};
        await Promise.all(Array.from({length:Math.min(8,offs.length)},run));
        let from=offs.length*1000,last=pages[pages.length-1].length;
        while(last===1000){const r=await pg(from);if(r.error)throw r.error;pages.push(r.data);last=r.data.length;from+=1000}
        const seen=new Set(),u=[];for(const x of pages.flat())if(!seen.has(x.id)){seen.add(x.id);u.push(x)}
        note(u.length);return u;
      }
      // première ouverture : nombre total d'abord, puis 6 pages à la fois
      const a=await sb.from("documents").select("id,data",{count:"exact"}).eq("collection",c).order("id").range(0,999);
      if(a.error)throw a.error;const tot=a.count==null?-1:a.count,pages=[a.data];if(tot>=0)note(tot);if(a.data.length<1000)return a.data;
      if(tot<0){for(let from=1000;;from+=1000){const r=await pg(from);if(r.error)throw r.error;pages.push(r.data);if(r.data.length<1000)break}return pages.flat()}
      const offs=[];for(let o=1000;o<tot;o+=1000)offs.push(o);
      let i=0;const run=async()=>{while(i<offs.length){const k=i++,r=await pg(offs[k]);if(r.error)throw r.error;pages[k+1]=r.data}};
      await Promise.all(Array.from({length:Math.min(6,offs.length)},run));
      const out=pages.flat();
      if(out.length===tot)return out;                 // sinon (ajouts pendant la lecture) : relecture simple
      const seen=new Set(),u=[];for(const x of out)if(!seen.has(x.id)){seen.add(x.id);u.push(x)}
      for(let from=Math.max(0,offs.length*1000);;from+=1000){const r=await pg(from);if(r.error)throw r.error;for(const x of r.data)if(!seen.has(x.id)){seen.add(x.id);u.push(x)}if(r.data.length<1000)break}
      return u;
    }
    const out=[];for(let from=0;;from+=1000){
      const {data,error}=await pg(from);
      if(error)throw error;out.push(...data);if(data.length<1000)break;
    }
    return out;
  }
  function docRef(c,id){
    return {
      id,
      async set(o){
        const data=JSON.parse(JSON.stringify(o)),prev=localOf(c,id);
        applyLocal(c,id,data);                                  // affichage immédiat
        try{
        let error=null;
        if(prev!==undefined&&prev!==null){                       // fiche connue : mise à jour directe (une seule requête)
          const r=await sb.from("documents").update({data}).eq("collection",c).eq("id",id).select("id");
          if(r.error)throw mkErr(r.error);
          if(r.data&&r.data.length){return}
        }
        ({error}=await sb.from("documents").insert({collection:c,id,data}));
        if(error&&error.code==="23505"){                       // existe déjà : remplacement (comme sur la plateforme Claude)
          const r=await sb.from("documents").update({data}).eq("collection",c).eq("id",id).select("id");
          if(r.error)throw mkErr(r.error);if(!r.data||!r.data.length)throw mkErr({code:"42501"});error=null;
        }
        if(error)throw mkErr(error);
        }catch(e){applyLocal(c,id,prev===undefined?null:prev);throw e}   // refus : retour à l'état précédent
      },
      async update(patch){
        const p=JSON.parse(JSON.stringify(patch)),prev=localOf(c,id);
        // mise à jour locale immédiate (fusion superficielle, comme « data || patch » côté serveur) ; le serveur confirme ensuite
        let done=false;(regs[c]||[]).forEach(r=>{if(r.merge&&r.merge(id,p))done=true});
        const {data,error}=await sb.rpc("merge_doc",{p_collection:c,p_id:id,p_patch:p});
        const ko=error?mkErr(error):!data?mkErr({code:"42501",message:"Document introuvable ou droit insuffisant."}):null;
        if(ko){if(prev!==undefined)applyLocal(c,id,prev);throw ko}
        if(!done){const g=await sb.from("documents").select("data").eq("collection",c).eq("id",id).maybeSingle();if(g.data)applyLocal(c,id,g.data.data)}
      },
      async delete(){
        const prev=localOf(c,id);applyLocal(c,id,null);
        const {data,error}=await sb.from("documents").delete().eq("collection",c).eq("id",id).select("id");
        const ko=error?mkErr(error):(!data||!data.length)?mkErr({code:"42501",message:"Suppression refusée."}):null;
        if(ko){if(prev!==undefined)applyLocal(c,id,prev);throw ko}
      },
      async get(){
        const {data,error}=await sb.from("documents").select("data").eq("collection",c).eq("id",id).maybeSingle();
        if(error)throw mkErr(error);
        return {exists:!!data,data:()=>data?data.data:undefined};
      }
    };
  }
  /* « membres » = table members (comptes et rôles) */
  const mrow=r=>({uid:r.user_id,fonction:ROLE_FN[r.role]||r.role,nom:r.nom||"",prenom:r.prenom||"",actif:r.actif!==false,perimDir:r.perim_dir||"",perimSrv:r.perim_srv||""});
  function membersCollection(){

      doc:id=>memberRef(id),

          const {data,error}=await sb.from("members").select("user_id,role,nom,prenom,actif,perim_dir,perim_srv");

        return ()=>{dead=true;regs.membres.delete(reg);document.removeEventListener("visibilitychange",vis)};

  function memberRef(id){
    const done=()=>(regs.membres||[]).forEach(r=>r.apply());

      id,
      async set(o){
        const role=FN_ROLE[o.fonction]||"lecteur",uid=o.uid||id;

        if(error)throw mkErr(error);done();
      },
      async update(p){
        const u={};if(p.fonction)u.role=FN_ROLE[p.fonction]||"lecteur";if("actif" in p)u.actif=!!p.actif;if("nom" in p)u.nom=p.nom;if("perimDir" in p)u.perim_dir=p.perimDir||null;if("perimSrv" in p)u.perim_srv=p.perimSrv||null;if("prenom" in p)u.prenom=p.prenom;

      },
      async get(){const {data}=await sb.from("members").select("user_id,role,nom,prenom,actif,perim_dir,perim_srv").eq("user_id",id).maybeSingle();return {exists:!!data,data:()=>data?mrow(data):undefined}}

    if(window.__nitaExp&&window.localWipe)try{window.localWipe()}catch(e){}

    if(location.hash.includes("type=recovery")){return}   // l'écran de nouveau mot de passe est géré par l'évènement ci-dessus
    if(session){let t=0;try{t=+localStorage.getItem(IDLE_KEY)||0}catch(e){}
      if(!t||Date.now()-t>=IDLE_MS){try{await Promise.race([sb.auth.signOut({scope:"local"}),new Promise(r=>setTimeout(r,1500))])}catch(e){}try{localStorage.removeItem(sb.auth.storageKey)}catch(e){}try{localStorage.removeItem(IDLE_KEY)}catch(e){}if(window.localWipe)try{await window.localWipe()}catch(e){}session=null}}
    if(!session){await loginView((window.__nitaExp||(()=>{try{return sessionStorage.getItem("nita_exp")}catch(e){}})())?"Session expirée après 30 minutes d’inactivité. Reconnectez-vous.":"");({data:{session}}=await sb.auth.getSession())}
    try{
      if(!(await loadMe(session))){blockedView("Votre compte existe mais n'a pas encore de rôle ou a été désactivé. Contactez l'administrateur.");readyRes(null);return}
    }catch(e){blockedView("Impossible de vérifier votre compte : "+(e&&e.message||e));readyRes(null);return}
    try{if(await mfaGate()){for(const k in PREF)delete PREF[k];prefetch(PREF_ALL)}}
    catch(e){blockedView("Double vérification impossible : "+(e&&e.message||e));readyRes(null);return}
    if(!ME.nom||!ME.prenom){try{await identityView()}catch(e){}}
    DB=makeDB();hideOverlay();addLogout();idleGuard();readyRes(true);logConnexion();setTimeout(()=>{try{window.dispatchEvent(new Event("nita-pret"))}catch(e){}},0);
  }

  for(let r=0;r<n;r++){let c=0;while(c<n){if(q.isDark(r,c)){let s=c;while(c<n&&q.isDark(r,c))c++;d+=`M${s},${r}h${c-s}v1h-${c-s}z`}else c++}}
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 ${n+2} ${n+2}" shape-rendering="crispEdges"><path d="${d}"/></svg>`;
}

async function iaSuggest(){

  iaBusy=true;iaSug=[];iaSugMsg="Analyse de "+cand.length+" entrées…";iaPaintSug();
  const cal=CAL.map(c=>c[0]+" = "+c[1]+" ("+c[2]+" ans)").join(" ; ");
  const prompt=`Classe chaque entrée d’inventaire d’archives dans UNE catégorie du calendrier de conservation ci-dessous. Réponds uniquement par un tableau JSON d’objets {"id":"...","cat":"CODE","confiance":"haute|moyenne|faible"}. Si aucune catégorie ne convient, mets "cat":"". Ne devine pas : mets une confiance faible en cas de doute.\n\nCALENDRIER : ${cal}\n\nENTRÉES :\n`+cand.map(d=>JSON.stringify({id:d.id,intitule:d.intitule,annee:d.annee,type:d.type,direction:d.direction})).join("\n");

  }catch(e){fail(e)}
}

const rcMiennes=()=>(RC.L||[]).filter(x=>x.user_id===P.id&&x.statut!=="ouverte"&&x.clos_le&&Date.now()-new Date(x.clos_le)<14*86400e3);

/* suggestions immédiates : inventaire (déjà en mémoire), texte des fichiers de la GED, recherches semblables */
const rcMots=q=>norm(q).split(/\s+/).filter(w=>w.length>2&&!["les","des","une","pour","dans","avec","sur","aux","du","de","la","le"].includes(w));
function rcInv(q,n){const w=rcMots(q);if(!w.length)return [];const mini=Math.max(1,Math.ceil(w.length/2)),sc=[];
  for(const d of docs){if(d.statut==="detruit")continue;const k=srchKey(d);let c=0;for(const x of w)if(k.includes(x))c++;if(c>=mini)sc.push([c,d])}
  return sc.sort((x,y)=>y[0]-x[0]).slice(0,n).map(x=>x[1])}
let rcT=null,rcSeq=0;

  const simH=sim.slice(0,3).map(x=>`<div class="rcs"><div><b>${esc(x.titre)}</b><div class="mu" style="font-size:12px">${esc(x.nom)} le cherche déjà · ${rcAge(x.cree_le)}</div></div><button class="sm" data-a="rcaussi" data-v="${esc(x.id)}">${(x.aussi||[]).includes(P.id)?"Je suis":"Moi aussi"}</button></div>`).join("");
  const rendu=ged=>{if(!$(cible))return;box.innerHTML=(simH?`<div class="mu rch">Déjà cherché par un collègue</div>${simH}`:"")+(invH?`<div class="mu rch">${mode==="pick"?"Inventaire":"Peut-être déjà dans l’inventaire"}</div>${invH}`:"")+(ged||"")+(!simH&&!invH&&!ged?'<div class="mu" style="font-size:12px">Rien de semblable pour l’instant'+(mode==="pick"?".":" : publiez votre recherche.")+'</div>':"")};
  rendu('<div class="mu rch">Recherche dans le texte des fichiers de la GED…</div>');
  const seq=++rcSeq;rcT=setTimeout(async()=>{let ged="";
    // GED : par le nom du fichier (toujours disponible) et par le texte des pages (quand le fichier est indexé) ; droits appliqués par le serveur
    const brut=q.split(/\s+/).filter(x=>x.length>2).sort((x,y)=>y.length-x.length)[0]||q,nomP=gsb().from("ged_fichiers").select("id,nom,service_id,annee").eq("courant",true).neq("statut","corbeille").ilike("nom","%"+brut.replace(/[%_,()\\]/g," ").trim()+"%").limit(40).then(r=>r.data||[],()=>[]);

      T.forEach(r=>{if(!vus.has(r.fichier_id)){vus.add(r.fichier_id);L.push({id:r.fichier_id,nom:r.nom,txt:"p. "+esc(r.page)+" : … "+gHl(r.extrait||"",q)+" …",h:1})}});
      if(L.length)ged=`<div class="mu rch">${mode==="pick"?"GED":"Peut-être déjà dans la GED"}</div>`+L.slice(0,n).map(r=>`<div class="rcs"><div><b>${esc(r.nom)}</b><div class="mu gext" style="font-size:12px">${r.h?r.txt:esc(r.txt)}</div></div>${mode==="pick"?`<button class="sm pri" data-a="rcpick" data-k="ged" data-v="${esc(r.id)}" data-n="${esc(r.nom)}">Joindre</button>`:`<button class="sm" data-a="rcged" data-v="${esc(r.id)}">Ouvrir</button>`}</div>`).join("")}catch(e){}
    if(seq===rcSeq)rendu(ged)},450)}

    "Contenu (dossier data) :\r\n- inventaire.csv : registre complet ("+L.length+" entrées), séparateur point-virgule, UTF-8.\r\n- dublin-core.xml : mêmes entrées en Dublin Core (ISO 15836, schéma OAI-DC).\r\n- prets.csv : sorties et consultations ("+prets.length+").\r\n\r\n"+

let pend=[];
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const SYN={direction:["direction"],service:["service"],annee:["annee","exercice"],mois:["mois"],type:["type","support","type de support","contenant","type de document"],nb:["nombre","nb","quantite","qte","unites","nombre d unites","nombre de chronos","nb chronos","volume"],cote:["cote","reference","code","code plan","cote plan"],empl:["emplacement","localisation","armoire","rayon","etagere"],mots:["mots cles","mots cle"],obs:["observations","observation","remarques","remarque","commentaire","commentaires","notes"],intitule:["intitule","designation","libelle","titre","nom du document","description","document","contenu","objet"]};

function parseSheets(wb){
  let best=null;
  for(const name of wb.SheetNames){
    const rows=(Array.isArray(wb.Sheets[name])?wb.Sheets[name]:XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:"",raw:true}));
    for(let i=0;i<Math.min(rows.length,25);i++){
      const map={},used=new Set();
      rows[i].forEach((c,j)=>{const n=norm(c);if(!n||used.has(j))return;for(const k in SYN)if(map[k]===undefined&&SYN[k].some(s=>n===s||n.startsWith(s+" "))){map[k]=j;used.add(j);break}});

        const rest=rows.slice(i+1),ok=r=>String(r[map.direction]).trim()&&String(r[map.service]).trim(),data=rest.filter(ok),sans=rest.filter(r=>!ok(r)&&r.some(c=>String(c??"").trim())).length;
        if(!best||data.length>best.data.length)best={name,map,data,sans};
        break;
      }

}
let skipN=0;
function toEntries(b){
  skipN=0;
  const g=(r,k)=>b.map[k]===undefined?"":String(r[b.map[k]]??"").trim(),agg={};
  for(const r of b.data){
    const tn=norm(g(r,"type")),type=tn.includes("carton")?"Carton":tn.includes("chemise")?"Chemise":"Chrono";
    const o={direction:g(r,"direction"),service:g(r,"service"),annee:parseInt(g(r,"annee"))||0,mois:g(r,"mois"),type,intitule:g(r,"intitule"),nb:Math.max(1,parseInt(g(r,"nb"))||1),cote:g(r,"cote"),empl:g(r,"empl"),mots:g(r,"mots"),obs:g(r,"obs")};
    if(!o.annee||o.annee<1900||o.annee>new Date().getFullYear()+1||!o.direction||!o.service){if(r.some(c=>String(c??"").trim()))skipN++;continue}
    if(!o.intitule)o.intitule=`${type}s${o.mois?" "+o.mois:""} ${o.annee}`;
    const key=[o.direction,o.service,o.annee,o.mois,o.type,o.intitule].join("|");

}

<script>
/* ---- Fluidité : chargement automatique de la suite des listes, préchargement de la GED ---- */
(function(){

  const watch=()=>{if(!io)return;document.querySelectorAll('#app button[data-a="more"],#app button[data-g="more"]').forEach(b=>{if(!b._obs){b._obs=1;io.observe(b)}})};

  if(window.PLATFORM_SB){let essais=0;const pre=()=>{try{if(typeof G==="undefined"||G.ready||G.busy||navigator.onLine===false)return;
      // attendre l'utilisateur et la liste des services, sinon réessayer une seconde plus tard (10 fois au plus)
      if(!P.id||!refSrv.length){if(++essais<10)setTimeout(pre,1000);return}gedLoad()}catch(e){}};
    const idle=window.requestIdleCallback||(f=>setTimeout(f,1));setTimeout(()=>idle(pre,{timeout:1500}),1500)}
})();

    if(ios){const tab=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);show(`<b>Installer Archives NITA sur l’${tab?"iPad":"iPhone"}</b><span>Touchez <span class="ish">${SH}</span> <b>Partager</b> (${tab?"en haut à droite de l’écran":"en bas de l’écran, ou dans « ••• »"}), puis <b>« Sur l’écran d’accueil »</b> et <b>Ajouter</b>.</span>`)}
  },android||ios?2500:1500);
})();
</script>
<script>
/* ---- Navigation dans les longues pages : sommaire des sections ---- */
(function(){
  const app=document.getElementById("app");if(!app||!window.MutationObserver)return;
  const TABS={team:1,cons:1,pret:1,rap:1};let busy=false;
  const clean=t=>String(t).replace(/\s*\(\d+[^)]*\)\s*$/,"").trim();
  function build(){if(busy)return;busy=true;try{
    const old=app.querySelector(":scope > .secnav");
    if(!TABS[typeof tab!=="undefined"?tab:""]){if(old)old.remove();return}
    const hs=[...app.querySelectorAll(":scope > h2, :scope > div > h2, :scope > section > h2")].filter(h=>h.offsetParent!==null);
    if(hs.length<4){if(old)old.remove();return}
    const sig=hs.map(h=>clean(h.textContent)).join("|");if(old&&old.dataset.sig===sig)return;
    const n=document.createElement("div");n.className="secnav";n.dataset.sig=sig;n.setAttribute("role","navigation");n.setAttribute("aria-label","Sections de la page");
    hs.forEach((h,i)=>{if(!h.id)h.id="sec_"+i;const b=document.createElement("button");b.type="button";b.textContent=clean(h.textContent);b.onclick=()=>{const y=h.getBoundingClientRect().top+scrollY-(innerWidth<1024?70:16);scrollTo({top:y,behavior:"smooth"})};n.appendChild(b)});
    const ph=app.querySelector(":scope > .phd");if(old)old.replaceWith(n);else if(ph)ph.after(n);else app.prepend(n);
  }finally{busy=false}}
  /* construit avant l’affichage de l’écran : le contenu ne « saute » plus vers le bas */
  new MutationObserver(build).observe(app,{childList:true,subtree:false});
  setTimeout(build,800);
})();
/* ---- Fiche : historique des versions (administrateur, lecture seule ; copie conservée par le serveur à chaque modification) ---- */
(function(){
  const NOMS={intitule:"Intitulé",direction:"Direction",service:"Service",annee:"Année",mois:"Mois",type:"Support",nb:"Unités",cote:"Cote",empl:"Emplacement",cat:"Catégorie",statut:"Statut",obs:"Observations",mots:"Mots-clés",gel:"Destruction suspendue",pv:"PV",detruitLe:"Détruit le",liste:"Liste de destruction"};
  const val=v=>v===undefined||v===null||v===""?"(vide)":typeof v==="object"?"(modifié)":String(v);
  document.addEventListener("toggle",async e=>{const d=e.target;if(!d.classList||!d.classList.contains("vh")||!d.open||d.dataset.ok)return;d.dataset.ok="1";
    const box=d.querySelector(".vhl"),sb=window.GEDSB&&window.GEDSB(),cur=(typeof docs!=="undefined"&&docs.find(x=>x.id===d.dataset.id))||{};
    try{const {data,error}=await sb.from("documents_historique").select("t,nom,op,ancien").eq("collection","docs").eq("doc_id",d.dataset.id).order("t",{ascending:false}).limit(20);if(error)throw error;
      if(!data.length){box.textContent="Aucune modification enregistrée depuis la mise en place de l’historique (17/11/2026).";return}
      let apres=cur;const out=[];
      for(const v of data){const av=v.ancien||{},ch=[...new Set([...Object.keys(av),...Object.keys(apres)])].filter(k=>!/^(moves|t|id|_.*)$/.test(k)&&JSON.stringify(av[k])!==JSON.stringify(apres[k]));
        out.push(`<div class="vhi"><b>${esc(new Date(v.t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}))}</b> · ${esc(v.nom||"–")}${v.op==="delete"?" · <span style=\"color:var(--er)\">suppression</span>":""}<br>${ch.length?ch.slice(0,8).map(k=>`${esc(NOMS[k]||k)} : <s>${esc(val(av[k]))}</s> → ${esc(val(apres[k]))}`).join("<br>"):"(aucun champ visible modifié)"}</div>`);apres=av}
      box.innerHTML=out.join("");
    }catch(x){box.textContent="Historique indisponible : "+(x&&x.message||x)}},true);
})();
/* ---- Inventaire : toucher une carte ouvre sa fiche ---- */
document.addEventListener("click",e=>{const c=e.target.closest&&e.target.closest("#lst .card");if(!c||e.target.closest("button,a,input,select,textarea,label"))return;if(getSelection&&String(getSelection()).length)return;const f=c.querySelector('button[data-a="fiche"]');if(f)f.click()});
</script></body></html>
